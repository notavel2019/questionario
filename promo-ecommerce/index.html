#pname{position:absolute;left:30px;top:466px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:36px}
#pprice{position:absolute;left:30px;top:514px;font-weight:700;font-size:38px;color:var(--org)}
#buy{position:absolute;left:26px;right:26px;top:580px;height:96px;border-radius:28px;background:var(--ink);color:#fff;font-weight:700;font-size:38px;display:flex;align-items:center;justify-content:center;transform-origin:50% 50%}
.rule{position:absolute;left:26px;right:26px;height:84px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:30px}
#r1{top:704px;background:var(--org);color:#fff}
#r2{top:802px;border:4px dashed var(--ink);color:var(--ink);background:#FFF4E6}
#toast{position:absolute;left:18px;right:18px;top:16px;height:112px;border-radius:30px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:16px;padding:0 22px}
#toast .av{width:68px;height:68px;border-radius:50%;background:var(--yel);color:var(--ink);font-weight:800;font-size:34px;display:flex;align-items:center;justify-content:center;flex:none}
#toast b{display:block;font-size:30px}
#toast span{font-size:24px;color:#cbd5e1}
#cursor{position:absolute;left:0;top:0;width:70px;height:70px;transform-origin:6px 4px;z-index:5}
/* margem */
#pct{position:absolute;left:0;width:1080px;top:560px;text-align:center;font-weight:800;font-size:340px;line-height:1;letter-spacing:-6px;color:#7b8498}
#burst{position:absolute;left:140px;top:1000px;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(255,230,0,.95),rgba(255,90,31,.55) 45%,rgba(255,90,31,0) 70%)}
.coin{position:absolute;left:0;top:0;width:78px;height:78px;border-radius:50%;background:var(--yel);border:6px solid var(--ink);color:var(--ink);font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 28px rgba(255,230,0,.55)}
/* texto (fora da câmera) */
#txt{position:absolute;inset:0;pointer-events:none}
.t{position:absolute;left:30px;width:1020px;text-align:center;font-weight:700;line-height:1.0;letter-spacing:-2px;white-space:pre;opacity:0;visibility:hidden;transform-origin:50% 50%}
.t.ink{color:var(--ink)}.t.crm{color:var(--cream)}
.foot{font-family:'DM Sans',sans-serif;font-weight:500;font-size:30px;letter-spacing:0;line-height:1.2;opacity:0}
#cta{position:absolute;left:150px;width:780px;top:1330px;height:128px;border-radius:64px;background:var(--ink);color:var(--cream);font-weight:700;font-size:62px;letter-spacing:-1px;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 0 rgba(17,24,39,.22);visibility:hidden}
/* debug */
#ui{position:fixed;left:10px;right:10px;bottom:10px;display:none;color:#fff;font:14px monospace;z-index:9}
#ui.on{display:flex;gap:10px;align-items:center}#ui input{flex:1}
</style>

<script>
(function(){
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const W=1080,H=1920,DURATION=30, Q=new URLSearchParams(location.search);
const stage=$('#stage');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform='scale('+s+')';stage.style.left=((innerWidth-W*s)/2)+'px';stage.style.top=((innerHeight-H*s)/2)+'px';}
addEventListener('resize',fit);fit();

/* ---------- construção ---------- */
// concorrentes
const MINIS=[ // x,y (centro), rot, preço, lado de entrada
 [120,790,-9,'R$ 79',-1],[965,760,8,'R$ 82',1],[105,1030,6,'R$ 76',-1],[975,1040,-7,'R$ 84',1],[170,1660,-5,'R$ 80',-1],[915,1670,7,'R$ 78',1]];
MINIS.forEach((m,i)=>{const d=document.createElement('div');d.className='mini';d.id='m'+i;
 d.innerHTML='<div class="b"></div><div class="l"></div><div class="p">'+m[3]+'</div>';$('#minis').appendChild(d);
 gsap.set(d,{x:m[0]-100,y:m[1]-75,rotation:m[2],scale:0,transformOrigin:'50% 50%'});});
// moedas (determinístico: constantes por índice)
const NC=16, COINS=[];
for(let i=0;i<NC;i++){const d=document.createElement('div');d.className='coin';d.textContent='R$';$('#coins').appendChild(d);
 const a=(Math.sin(i*12.9898)*43758.5453)%1, b=(Math.sin(i*78.233)*12345.678)%1, c=(Math.sin(i*39.346)*9876.54)%1;
 COINS.push({el:d,vx:(Math.abs(a)-.5)*900,vy:-(1050+Math.abs(b)*750),rv:(Math.abs(c)-.5)*700,off:i*.11});}
// texto
const LINES=[
 ['L1','Você vende muito','ink',250,128,.45,1.95,0,-1],
 ['L2','Mas quanto\nfica?','ink',215,200,2.05,2.95,0,1],
 ['L3','Concorrente\nao lado','crm',230,150,3.55,4.6,-1,1],
 ['L4','Comissão','crm',280,185,4.7,5.8,1,-1],
 ['L5','Frete','crm',280,200,5.8,6.8,-1,1],
 ['L6','Anúncios','crm',280,185,6.85,8.0,1,-1],
 ['L7','E se a venda\nfosse sua?','ink',215,168,8.7,10.5,0,1],
 ['L8','Sua marca','ink',215,165,11.5,13.15,-1,1],
 ['L9','Seu cliente','ink',215,165,13.2,15.3,1,-1],
 ['L10','Sua regra','ink',215,165,15.4,17.45,-1,1],
 ['L11','A margem volta\npra você','crm',215,122,18.65,24.3,0,1],
 ['L12','Rogério\nWilbert','ink',640,150,25.15,30.1,0,1],
 ['L13','Plataforma de vendas\ncom WooCommerce','ink',1010,60,26.0,30.1,0,-1],
 ['L14','@rogeriowilbert','ink',1520,64,27.4,30.1,0,1]];
LINES.forEach(L=>{const d=document.createElement('div');d.className='t '+L[2];d.id=L[0];d.textContent=L[1];
 d.style.top=L[3]+'px';d.style.fontSize=L[4]+'px';$('#txt').appendChild(d);});
['F1','F2'].forEach((id,i)=>{const d=document.createElement('div');d.className='t foot crm';d.id=id;d.style.top='1810px';d.textContent='valores ilustrativos';$('#txt').appendChild(d);});

/* ---------- timeline ---------- */
const tl=gsap.timeline({paused:true});
const EO='power3.out';
// estados iniciais
gsap.set(['#f1','#l1'],{y:-H}); gsap.set(['#f2','#l2'],{x:-W}); gsap.set(['#f3'],{y:H});
gsap.set(['#f4','#l4'],{y:-H}); gsap.set(['#f5','#l5'],{x:W});
gsap.set('#box',{y:-1100,rotation:-8});
gsap.set('#tag',{scale:0});
gsap.set('#phone',{autoAlpha:0});
gsap.set('#cursor',{x:900,y:1560,autoAlpha:0});
gsap.set('#toast',{y:-160});
gsap.set(['#r1','#r2'],{x:700,autoAlpha:0});
gsap.set(['#c1','#c2','#c3'],{scale:0,y:50});
gsap.set(['#pmono','#pnm','#cart'],{scale:0,autoAlpha:0});
gsap.set('#badge',{scale:0});
gsap.set('#pct',{autoAlpha:0});gsap.set('#coins',{autoAlpha:0});
gsap.set('#burst',{scale:0,autoAlpha:0});
gsap.set('#cta',{y:80,autoAlpha:0});
gsap.set('#b1',{backgroundColor:'#FF5A1F',opacity:.22});
gsap.set('#b2',{backgroundColor:'#FFE600',opacity:.35});
gsap.set('#b3',{backgroundColor:'#FF5A1F',opacity:.12});

function say(id,t0,t1,dx,dy,o){o=o||{};
 tl.fromTo('#'+id,{autoAlpha:0,x:dx*90,y:dy*70,scaleY:1.18,filter:'blur(18px)'},{autoAlpha:1,x:0,y:0,scaleY:1,filter:'blur(0px)',duration:.6,ease:EO,immediateRender:true},t0);
 if(t1<30) tl.to('#'+id,{autoAlpha:0,x:-dx*40,y:-dy*50,scaleY:1.12,filter:'blur(14px)',duration:.32,ease:'power2.in'},t1-.32);}
LINES.forEach(L=>say(L[0],L[5],L[6],L[7],L[8]));
tl.to('#F1',{autoAlpha:.7,duration:.4},3.7).to('#F1',{autoAlpha:0,duration:.3},7.9);
tl.to('#F2',{autoAlpha:.7,duration:.4},19.2).to('#F2',{autoAlpha:0,duration:.3},24.3);

// câmera
function cam(t,d,s,tx,ty,ease){tl.to('#cam',{scale:s,x:(540-tx)*s,y:(960-ty)*s,duration:d,ease:ease||'power3.inOut'},t);}
// -- 0:00 gancho
tl.to('#box',{y:0,rotation:0,duration:.75,ease:'bounce.out'},.2);
tl.to('#tag',{scale:1,duration:.7,ease:'elastic.out(1,.5)'},.95);
cam(2.1,.8,1.5,735,800);
// transição 1: bloco tinta cai (líder amarelo)
tl.to('#l1',{y:0,duration:.55,ease:'power4.inOut'},2.95).to('#f1',{y:0,duration:.55,ease:'power4.inOut'},3.05);
cam(3.0,.6,.86,540,960);
// -- concorrentes
MINIS.forEach((m,i)=>{tl.to('#m'+i,{scale:1,duration:.6,ease:'back.out(2.2)'},3.5+i*.12);
 tl.fromTo('#m'+i,{x:m[0]-100+m[4]*260},{x:m[0]-100,duration:.6,ease:EO,immediateRender:false},3.5+i*.12);
 tl.to('#m'+i,{y:'+=14',duration:1.8,ease:'sine.inOut',yoyo:true,repeat:1},4.3);});
cam(4.6,.5,1.25,640,960);
['#c1','#c2','#c3'].forEach((c,i)=>tl.to(c,{scale:1,y:0,duration:.55,ease:'elastic.out(1,.55)'},5.0+i*1.05+(i?-0.0:0)));
tl.to('#tag',{rotation:'+=0',x:0,duration:.01},0); // placeholder (mantém ordem)
[5.0,6.05,7.1].forEach(t=>tl.fromTo('#tag',{scale:1.14},{scale:1,duration:.35,ease:'back.out(3)',immediateRender:false},t+.35));
cam(7.65,.5,1,540,960);
// -- virada (laranja da esquerda)
['#c1','#c2','#c3'].forEach((c,i)=>tl.to(c,{scale:0,y:60,duration:.3,ease:'power2.in'},7.95+i*.05));
tl.to('#l2',{x:0,duration:.5,ease:'power4.inOut'},8.05).to('#f2',{x:0,duration:.5,ease:'power4.inOut'},8.15);
MINIS.forEach((m,i)=>{tl.to('#m'+i,{x:m[0]-100+m[4]*900,y:m[1]-75-260-i*30,rotation:m[2]+m[4]*320,duration:.9,ease:'power3.in'},8.1+i*.05);});
tl.to('#tag',{scale:0,duration:.3,ease:'back.in(2)'},8.2);
// caixa vira sua
tl.to('#box',{'--bx':'#FFF4E6','--bxd':'#E8CFB2','--tape':'#FF5A1F',duration:.35,ease:'none'},8.45);
tl.to('#lbl1',{opacity:0,duration:.2},8.45).to('#lbl2',{opacity:1,duration:.3},8.6);
tl.to('#box',{scale:1.14,duration:.35,ease:'back.out(3)'},8.5).to('#box',{scale:1,duration:.5,ease:'power2.out'},8.9);
cam(8.4,.9,1.2,540,980);cam(9.5,.9,1,540,960);
// -- loja própria (chão creme sobe)

/* ---------- funções puras do tempo ---------- */
const PRICE=[[0,100],[5.0,100],[5.45,84],[6.05,84],[6.5,71],[7.1,71],[7.55,57],[99,57]];
function lerpKeys(K,t,ease){for(let i=0;i<K.length-1;i++){if(t>=K[i][0]&&t<K[i+1][0]){const p=(t-K[i][0])/(K[i+1][0]-K[i][0]);const e=ease?ease(p):p;return K[i][1]+(K[i+1][1]-K[i][1])*e;}}return K[K.length-1][1];}
const eo=p=>1-Math.pow(1-p,3);
const priceEl=$('#price'),pctEl=$('#pct'),grain=$('#grain'),coinsEl=$$('.coin');
function render(t){
 priceEl.textContent='R$ '+Math.round(lerpKeys(PRICE,t,eo));
 const pv=t<19.9?12:(t>=22.6?34:12+22*eo((t-19.9)/2.7));
 pctEl.textContent=Math.round(pv)+'%';
 const g=Math.floor(t*14);grain.style.transform='translate('+(-((Math.sin(g*91.7)*.5+.5)*280))+'px,'+(-((Math.cos(g*53.3)*.5+.5)*280))+'px)';
 const live=t>=19.8&&t<=24.6;
 COINS.forEach((c,i)=>{
  if(!live){c.el.style.opacity=0;return;}
  let dt=(t-19.8-c.off)%2.8; if(t-19.8-c.off<0){c.el.style.opacity=0;return;}
  const x=540+c.vx*dt, y=1250+c.vy*dt+0.5*2300*dt*dt;
  const op=dt<2.3?1:Math.max(0,1-(dt-2.3)/.5);
  c.el.style.opacity=op;c.el.style.transform='translate('+(x-39)+'px,'+(y-39)+'px) rotate('+(c.rv*dt)+'deg)';});
}
tl.eventCallback('onUpdate',()=>render(tl.time()));
tl.eventCallback('onComplete',()=>{tl.play(0);});

function seek(t){tl.pause();tl.time(t,false);render(tl.time());}
window.OPENER={tl,DURATION,W,H,seek,ready:false};

/* controles */
if(Q.has('debug')){$('#ui').classList.add('on');const sc=$('#sc'),tm=$('#tm');
 sc.addEventListener('input',()=>seek(+sc.value));$('#pl').onclick=()=>tl.paused()?tl.play():tl.pause();
 gsap.ticker.add(()=>{if(!tl.paused()){sc.value=tl.time();}tm.textContent=tl.time().toFixed(2);});}
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')tl.play(0);if(e.code==='Space'){e.preventDefault();tl.paused()?tl.play():tl.pause();}});
document.fonts.ready.then(()=>{render(0);window.OPENER.ready=true;if(!Q.has('clean'))tl.play(0);});
})();
