<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Semente — Motion</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
/*FONTS*/
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050806;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;font-family:'Anton',Impact,sans-serif;background:#0c120e}
#world{position:absolute;inset:0}
.sc{position:absolute;inset:0;visibility:hidden;overflow:hidden}
.gd{position:absolute;left:0;width:1080px}
.o{position:absolute;left:0;top:0}
.o svg{display:block;overflow:visible}
.tx{position:absolute;left:0;top:0;white-space:nowrap;line-height:1;text-transform:uppercase}
.hand{font-family:'Caveat',cursive;font-weight:700;text-transform:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 42%,rgba(0,0,0,.6) 100%);pointer-events:none;z-index:50}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:55;pointer-events:none}
#cap{position:absolute;left:40px;width:1000px;top:1400px;height:340px;z-index:60;pointer-events:none}
.chunk{position:absolute;inset:0;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:0 .26em;text-align:center;text-transform:uppercase;color:#fff;line-height:1.04;
  text-shadow:0 6px 0 rgba(0,0,0,.55),0 0 28px rgba(0,0,0,.7);visibility:hidden}
.w{display:inline-block;transform-origin:50% 75%}
#pb{position:absolute;left:0;top:0;height:8px;width:1080px;background:#ffc83d;transform-origin:0 0;transform:scaleX(0);z-index:70}
#start{position:absolute;inset:0;z-index:100;background:rgba(5,8,6,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;color:#fff;cursor:pointer;text-transform:uppercase}
#start b{font-weight:400;font-size:170px;line-height:.95;text-align:center}
#start span{font-family:'Caveat',cursive;font-size:84px;color:#ffc83d;text-transform:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe58f"/><stop offset="1" stop-color="#f4a21f"/></linearGradient>
  <linearGradient id="gLeaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#58e08e"/><stop offset="1" stop-color="#1f9d57"/></linearGradient>
  <linearGradient id="gTrunk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a6a42"/><stop offset="1" stop-color="#5a3820"/></linearGradient>
  <linearGradient id="gFruit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb43f"/><stop offset="1" stop-color="#ee5a1d"/></linearGradient>
  <linearGradient id="gRoot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2c4"/><stop offset="1" stop-color="#f4b73f"/></linearGradient>
</defs></svg>
<div id="stage">
  <div id="world"></div>
  <div id="vig"></div><div id="flash"></div>
  <div id="cap"></div>
  <div id="pb"></div>
  <div id="start"><b>Semente</b><span>toque para assistir com som</span></div>
</div>
<audio id="au" src="audio.m4a" preload="auto"></audio>

<script>
const WORDS = /*WORDS*/;
const $ = s => document.querySelector(s);
const stage = $('#stage'), world = $('#world');
function fit(){ const s = Math.min(innerWidth/1080, innerHeight/1920);
  stage.style.transform = `translate(${(innerWidth-1080*s)/2}px,${(innerHeight-1920*s)/2}px) scale(${s})`; }
addEventListener('resize', fit); fit();

const t0 = i => WORDS[i][0], t1 = i => WORDS[i][1];
const TXT = WORDS.map(w => w[2].trim()); TXT[3] = 'quer'; TXT[4] = 'a';

/* ---------- arte (SVG) ---------- */
const SV = {
 seed:`<svg width="140" height="180" viewBox="0 0 140 180"><g transform="rotate(-18 70 90)"><ellipse cx="70" cy="90" rx="48" ry="68" fill="url(#gGold)" stroke="#b97a12" stroke-width="6"/><path d="M70 32C60 70 60 110 70 150" stroke="#b97a12" stroke-width="5" fill="none" opacity=".7"/><ellipse cx="50" cy="62" rx="9" ry="20" fill="#fff" opacity=".5"/></g></svg>`,
 tree:`<svg width="450" height="560" viewBox="0 0 450 560"><path d="M200 560C206 480 202 430 190 370L260 370C248 430 244 480 250 560Z" fill="url(#gTrunk)"/><g fill="url(#gLeaf)"><circle cx="225" cy="210" r="150"/><circle cx="125" cy="285" r="95"/><circle cx="328" cy="285" r="98"/><circle cx="225" cy="310" r="105"/></g><g fill="#fff" opacity=".16"><circle cx="165" cy="160" r="55"/><circle cx="110" cy="262" r="30"/></g></svg>`,
 dry:`<svg width="450" height="560" viewBox="0 0 450 560"><path d="M200 560C206 480 202 430 192 330L258 330C248 430 244 480 250 560Z" fill="#8a7767"/><g stroke="#9c8977" stroke-width="16" stroke-linecap="round" fill="none"><path d="M225 400L150 250M225 400L300 240M225 340L225 140M205 340L110 170M245 340L345 175"/></g><g stroke="#9c8977" stroke-width="9" stroke-linecap="round" fill="none"><path d="M150 250L120 190M300 240L330 180M225 220L190 170M110 170L90 120M345 175L370 125"/></g></svg>`,
 sprout:`<svg width="200" height="320" viewBox="0 0 200 320"><path d="M100 320C100 240 95 170 100 96" stroke="#3fd07a" stroke-width="16" stroke-linecap="round" fill="none"/><path d="M100 150C40 142 16 96 26 60C80 58 108 100 100 150Z" fill="url(#gLeaf)"/><path d="M100 110C160 104 188 60 178 24C124 22 94 62 100 110Z" fill="url(#gLeaf)"/></svg>`,
 mound:`<svg width="760" height="180" viewBox="0 0 760 180"><path d="M0 180C70 70 200 30 380 30C560 30 690 70 760 180Z" fill="#7a4a2a"/><path d="M60 180C130 100 230 70 380 70C530 70 630 100 700 180Z" fill="#8d5a34"/><g fill="#4a2c18"><circle cx="220" cy="120" r="12"/><circle cx="420" cy="90" r="9"/><circle cx="540" cy="130" r="14"/><circle cx="330" cy="140" r="8"/></g></svg>`,
 x:`<svg width="220" height="220" viewBox="0 0 220 220"><g stroke="#ff4d57" stroke-width="34" stroke-linecap="round"><path d="M30 30L190 190M190 30L30 190"/></g></svg>`,
 check:`<svg width="220" height="220" viewBox="0 0 220 220"><circle cx="110" cy="110" r="100" fill="#43d17a"/><path d="M60 114L98 152L162 70" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`,
 person:`<svg width="90" height="130" viewBox="0 0 90 130"><circle cx="45" cy="32" r="28" fill="currentColor"/><path d="M4 130C4 84 24 68 45 68C66 68 86 84 86 130Z" fill="currentColor"/></svg>`,
 fruit:`<svg width="130" height="150" viewBox="0 0 130 150"><path d="M65 36C65 20 70 10 82 4" stroke="#6b4226" stroke-width="8" stroke-linecap="round" fill="none"/><path d="M72 24C90 4 112 10 116 22C100 34 82 32 72 24Z" fill="#43d17a"/><circle cx="65" cy="92" r="56" fill="url(#gFruit)"/><ellipse cx="44" cy="70" rx="12" ry="20" fill="#fff" opacity=".35"/></svg>`,
 heart:`<svg width="90" height="80" viewBox="0 0 90 80"><path d="M45 78C10 52 0 34 0 22C0 8 12 0 24 0C34 0 41 6 45 14C49 6 56 0 66 0C78 0 90 8 90 22C90 34 80 52 45 78Z" fill="#ff5a6e"/></svg>`,
 star:`<svg width="60" height="60" viewBox="0 0 60 60"><path d="M30 0C33 20 40 27 60 30C40 33 33 40 30 60C27 40 20 33 0 30C20 27 27 20 30 0Z" fill="#ffe08a"/></svg>`,
 lock:`<svg width="240" height="320" viewBox="0 0 240 320"><path d="M60 140V96C60 40 180 40 180 96V140" stroke="#e8b630" stroke-width="28" fill="none" stroke-linecap="round"/><rect x="20" y="130" width="200" height="170" rx="36" fill="url(#gGold)" stroke="#b97a12" stroke-width="6"/><circle cx="120" cy="204" r="24" fill="#5a3d0a"/><path d="M108 214H132L138 262H102Z" fill="#5a3d0a"/></svg>`,
 book:`<svg width="520" height="300" viewBox="0 0 520 300"><path d="M0 80V285C100 255 200 255 260 292C320 255 420 255 520 285V80Z" fill="#6b3f1d"/><path d="M260 58C200 28 100 28 18 58V268C100 238 200 238 260 272Z" fill="#fffdf4" stroke="#caa86a" stroke-width="6"/><path d="M260 58C320 28 420 28 502 58V268C420 238 320 238 260 272Z" fill="#fffaf0" stroke="#caa86a" stroke-width="6"/><g stroke="#cdbb97" stroke-width="6" stroke-linecap="round" fill="none"><path d="M60 100C110 90 170 90 225 104M60 134C110 124 170 124 225 138M60 168C110 158 170 158 225 172M295 104C350 90 410 90 460 100M295 138C350 124 410 124 460 134M295 172C350 158 410 158 460 168"/></g></svg>`,
 cloud:`<svg width="520" height="220" viewBox="0 0 520 220"><g fill="#46577a"><circle cx="130" cy="130" r="80"/><circle cx="240" cy="95" r="95"/><circle cx="370" cy="125" r="85"/><circle cx="450" cy="150" r="55"/><rect x="60" y="130" width="440" height="75" rx="37"/></g></svg>`,
 bolt:`<svg width="130" height="320" viewBox="0 0 130 320"><path d="M80 0L10 170H62L38 320L122 130H70Z" fill="#ffe45e" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg>`,
 crown:`<svg width="170" height="120" viewBox="0 0 170 120"><path d="M10 112L2 22L52 62L85 4L118 62L168 22L160 112Z" fill="url(#gGold)" stroke="#b97a12" stroke-width="6" stroke-linejoin="round"/><circle cx="85" cy="82" r="10" fill="#ff4d57"/></svg>`,
 up:`<svg width="70" height="110" viewBox="0 0 70 110"><path d="M35 106V22M8 48L35 14L62 48" stroke="#ff6b57" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
 hands:`<svg width="300" height="240" viewBox="0 0 300 240"><g fill="#f2c9a0" stroke="#c98f5e" stroke-width="6"><ellipse cx="108" cy="140" rx="40" ry="80" transform="rotate(28 108 140)"/><ellipse cx="192" cy="140" rx="40" ry="80" transform="rotate(-28 192 140)"/></g><g stroke="#ffc83d" stroke-width="10" stroke-linecap="round"><path d="M150 40V0M104 52L84 14M196 52L216 14"/></g></svg>`,
 no:`<svg width="320" height="320" viewBox="0 0 320 320"><circle cx="160" cy="160" r="136" fill="none" stroke="#ff4d57" stroke-width="28"/><path d="M64 256L256 64" stroke="#ff4d57" stroke-width="28" stroke-linecap="round"/></svg>`,
 roots:`<svg width="560" height="700" viewBox="0 0 560 700"><g fill="none" stroke="url(#gRoot)" stroke-linecap="round"><path class="r" pathLength="1" stroke-width="16" d="M280 0C280 120 250 220 290 330C320 420 270 520 285 690"/><path class="r" pathLength="1" stroke-width="10" d="M275 120C200 160 140 200 110 290C90 350 80 420 70 500"/><path class="r" pathLength="1" stroke-width="10" d="M280 150C360 190 430 230 470 330C490 390 500 450 510 540"/><path class="r" pathLength="1" stroke-width="9" d="M270 260C220 300 190 360 180 440"/><path class="r" pathLength="1" stroke-width="9" d="M300 330C350 380 390 430 400 520"/><path class="r" pathLength="1" stroke-width="8" d="M286 500C230 540 210 600 190 660"/><path class="r" pathLength="1" stroke-width="8" d="M286 520C340 560 370 610 380 680"/></g></svg>`,
 sun:`<svg width="300" height="300" viewBox="0 0 300 300"><g stroke="#ffd54a" stroke-width="14" stroke-linecap="round"><path d="M150 10V50M150 250V290M10 150H50M250 150H290M52 52L80 80M220 220L248 248M248 52L220 80M80 220L52 248"/></g><circle cx="150" cy="150" r="76" fill="url(#gGold)"/></svg>`,
 shallow:`<svg width="300" height="110" viewBox="0 0 300 110"><g fill="none" stroke="#c9a27a" stroke-width="9" stroke-linecap="round"><path d="M150 0C150 30 140 50 120 70M150 0C150 30 165 50 190 66M150 0C148 30 150 60 150 84"/></g><g fill="none" stroke="#ff4d57" stroke-width="6" stroke-dasharray="2 14" stroke-linecap="round"><ellipse cx="150" cy="40" rx="100" ry="62"/></g></svg>`
};

/* ---------- helpers ---------- */
const tl = gsap.timeline({paused:true});
window.__tl = tl;
const GY = 1060;
function mkScene(bg){ const d = document.createElement('div'); d.className = 'sc'; d.style.background = bg; world.appendChild(d); return d; }
function ground(sc, top, a, b, grass){
  const g = document.createElement('div'); g.className='gd'; g.style.cssText = `top:${top}px;height:${1920-top}px;background:linear-gradient(${a},${b})`; sc.appendChild(g);
  if (grass){ const t = document.createElement('div'); t.className='gd'; t.style.cssText = `top:${top-6}px;height:22px;background:${grass};border-radius:12px`; sc.appendChild(t); }
  return g;
}
function O(sc, svg, w, h, x, y, o = {}){
  const a = o.a || 'b';
  const d = document.createElement('div'); d.className = 'o';
  d.style.cssText = `width:${w}px;height:${h}px;left:${x-w/2}px;top:${a==='b' ? y-h : y-h/2}px;transform-origin:${o.origin || (a==='b' ? '50% 100%' : '50% 50%')}`;
  if (o.color) d.style.color = o.color;
  d.innerHTML = svg; sc.appendChild(d); return d;
}
function TX(sc, text, x, y, size, color, cls = ''){
  const d = document.createElement('div'); d.className = 'tx ' + cls; d.textContent = text;
  d.style.cssText = `left:${x}px;top:${y}px;font-size:${size}px;color:${color}`; sc.appendChild(d);
  gsap.set(d, {xPercent:-50, yPercent:-50}); return d;
}
function glow(sc, x, y, r, color){
  const d = document.createElement('div'); d.className = 'o';
  d.style.cssText = `width:${r*2}px;height:${r*2}px;left:${x-r}px;top:${y-r}px;border-radius:50%;background:radial-gradient(circle,${color} 0%,transparent 68%)`;
  sc.appendChild(d); return d;
}
const hide = (...e) => gsap.set(e.flat(), {scale:0, autoAlpha:0});
const pop = (e, t, s = 1, d = .5, ease = 'back.out(2.4)') => tl.to(e, {scale:s, autoAlpha:1, duration:d, ease}, t);
const fade = (e, t, d = .25) => tl.to(e, {autoAlpha:0, duration:d}, t);
function scene(sc, a, b){
  gsap.set(sc, {autoAlpha:0});
  tl.to(sc, {autoAlpha:1, duration:.3, ease:'none'}, a - .1);
  if (b < 60) tl.to(sc, {autoAlpha:0, duration:.3, ease:'none'}, b - .1);
}
function sparkles(sc, x, y, t, n = 7, R = 220){
  const arr = [];
  for (let i = 0; i < n; i++){
    const s = O(sc, SV.star, 60, 60, x, y, {a:'c'}); hide(s); arr.push(s);
    const ang = i/n*Math.PI*2 + .4, r = R*(.6 + (i%3)*.25);
    tl.to(s, {x:Math.cos(ang)*r, y:Math.sin(ang)*r, scale:.5 + (i%3)*.35, autoAlpha:1, rotation:90, duration:.5, ease:'power2.out'}, t + i*.03);
    tl.to(s, {autoAlpha:0, scale:0, duration:.4}, t + .55 + i*.03);
  }
}
const punch = t => tl.fromTo(world, {scale:1.035}, {scale:1, duration:.45, ease:'power2.out', immediateRender:false}, t);

/* ========== CENAS ========== */
/* 1 · geração quer a sombra da árvore pronta */
{ const sc = mkScene('#10241a'); scene(sc, 0, 4.0);
  ground(sc, GY, '#2c7a4b', '#0f2a1a', '#3a9a5f');
  const sun = O(sc, SV.sun, 300, 300, 880, 300, {a:'c'}); hide(sun); pop(sun, .1, 1, .6); tl.to(sun, {rotation:60, duration:4, ease:'none'}, 0);
  const sh = O(sc, '<svg width="640" height="70" viewBox="0 0 640 70"><ellipse cx="320" cy="35" rx="310" ry="32" fill="#000" opacity=".4"/></svg>', 640, 70, 540, GY + 30, {a:'c'}); gsap.set(sh, {scaleX:0, autoAlpha:0});
  const tr = O(sc, SV.tree, 450, 560, 540, GY + 6); hide(tr);
  const people = [260, 400, 540, 680, 820].map((x, i) => { const p = O(sc, SV.person, 90, 130, x, 1330, {color:['#f6f4ee','#ffe08a','#bfe6ff','#ffe08a','#f6f4ee'][i]}); hide(p); return p; });
  people.forEach((p, i) => pop(p, t0(0) + i*.22, .95, .45));
  pop(tr, t0(5) - .35, 1.55, .7, 'elastic.out(1,.55)');
  tl.to(sh, {scaleX:1, autoAlpha:1, duration:.6, ease:'power2.out'}, t0(5));
  const badge = TX(sc, 'PRONTA', 540, 360, 120, '#10241a'); badge.style.cssText += ';background:#ffc83d;padding:18px 40px;border-radius:70px';
  hide(badge); pop(badge, t0(8) - .05, 1, .45);
  tl.to(badge, {y:-14, duration:.5, yoyo:true, repeat:1, ease:'sine.inOut'}, t0(8) + .5);
}
/* 2 · despreza a semente e odeia a terra */
{ const sc = mkScene('#1a1b17'); scene(sc, 4.0, 8.6);
  ground(sc, GY, '#6e4527', '#2a170c', '#4a3320');
  const seed = O(sc, SV.seed, 140, 180, 330, GY - 140, {a:'c'}); hide(seed); pop(seed, 4.05, 1.5, .5);
  tl.to(seed, {x:760, y:-340, rotation:520, duration:.7, ease:'power2.in'}, t0(12) - .45);
  tl.to(seed, {autoAlpha:0, duration:.1}, t0(12) + .22);
  const x1 = O(sc, SV.x, 220, 220, 330, GY - 160, {a:'c'}); hide(x1); pop(x1, t0(12) - .1, 1.1, .35);
  const mound = O(sc, SV.mound, 760, 180, 730, GY + 6); hide(mound); pop(mound, t0(14) - .1, .85, .5);
  tl.to(mound, {x:'+=14', duration:.06, yoyo:true, repeat:7, ease:'none'}, t0(14) + .3);
  const x2 = O(sc, SV.x, 220, 220, 730, GY - 110, {a:'c'}); hide(x2); pop(x2, t0(16) - .05, 1.2, .35);
  const red = glow(sc, 540, 900, 900, 'rgba(255,60,60,.32)'); gsap.set(red, {autoAlpha:0});
  tl.to(red, {autoAlpha:1, duration:.15, yoyo:true, repeat:1}, t0(14));
}
/* 3 · Gênesis: Deus não cria florestas prontas */
{ const sc = mkScene('#1b1736'); scene(sc, 8.6, 12.95);
  const rays = document.createElement('div'); rays.className = 'o';
  rays.style.cssText = 'left:-160px;top:160px;width:1400px;height:1400px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,200,61,.30) 0 8deg,transparent 8deg 24deg);-webkit-mask-image:radial-gradient(circle,#000 5%,transparent 66%);mask-image:radial-gradient(circle,#000 5%,transparent 66%)';
  sc.appendChild(rays); gsap.set(rays, {autoAlpha:0}); tl.to(rays, {autoAlpha:1, duration:.5}, 8.8); tl.to(rays, {rotation:40, duration:4.4, ease:'none'}, 8.7);
  const book = O(sc, SV.book, 520, 300, 540, 1130); hide(book); pop(book, t0(19) - .15, 1.45, .6);
  const gl = TX(sc, 'Gênesis 1', 540, 1180, 110, '#ffc83d', 'hand'); hide(gl); pop(gl, t0(19) + .25, 1, .45);
  tl.to(book, {y:-12, duration:.8, yoyo:true, repeat:4, ease:'sine.inOut'}, 9.9);
  const trees = [190, 365, 540, 715, 890].map((x, i) => { const t = O(sc, SV.tree, 450, 560, x, 720); hide(t); pop(t, t0(23) + i*.09, .36, .45); return t; });
  const xx = O(sc, SV.x, 220, 220, 540, 560, {a:'c'}); hide(xx); pop(xx, t0(24) - .05, 2.4, .35);
  tl.to(trees, {y:70, autoAlpha:0, duration:.45, stagger:.04, ease:'power2.in'}, t0(24) + .5);
  tl.to(xx, {autoAlpha:0, duration:.3}, t0(24) + 1.0);
}
/* 4 · entrega sementes que contêm florestas */
{ const sc = mkScene('#0f2a1e'); scene(sc, 12.95, 17.0);
  const g = glow(sc, 540, 820, 420, 'rgba(255,200,61,.55)'); gsap.set(g, {autoAlpha:0});
  const seed = O(sc, SV.seed, 140, 180, 540, 820, {a:'c'}); hide(seed);
  pop(seed, t0(26) - .1, 2.1, .6); tl.to(g, {autoAlpha:1, duration:.5}, t0(26));
  tl.to(g, {scale:1.15, duration:.5, yoyo:true, repeat:5, ease:'sine.inOut'}, t0(26) + .5);
  sparkles(sc, 540, 820, t0(27) - .1, 8, 300);
  const lens = document.createElement('div'); lens.className = 'o';
  lens.style.cssText = 'left:290px;top:570px;width:500px;height:500px;border-radius:50%;overflow:hidden;border:12px solid #ffc83d;background:linear-gradient(#8fd3ff,#e6f7ff 62%,#7ccf8a 62%)';
  sc.appendChild(lens); gsap.set(lens, {scale:0, autoAlpha:0});
  const mini = [[110, 430, .42], [250, 440, .52], [390, 430, .4]].map(([x, y, s], i) => { const d = document.createElement('div'); d.className = 'o';
    d.style.cssText = `left:${x-225}px;top:${y-560}px;width:450px;height:560px;transform-origin:50% 100%`; d.innerHTML = SV.tree; lens.appendChild(d); gsap.set(d, {scale:0}); return [d, s]; });
  tl.to(seed, {scale:.3, autoAlpha:0, duration:.35, ease:'power2.in'}, t0(29) - .05);
  tl.to(lens, {scale:1, autoAlpha:1, duration:.55, ease:'back.out(1.8)'}, t0(29));
  mini.forEach(([d, s], i) => tl.to(d, {scale:s, duration:.6, ease:'elastic.out(1,.5)'}, t0(30) + i*.12));
  sparkles(sc, 540, 820, t0(30) + .1, 9, 330);
}
/* 5 · enterrado? calma, plantado */
{ const sc = mkScene('#241810'); scene(sc, 17.0, 22.7);
  ground(sc, 900, '#6a4224', '#24140a', '#3f8a52');
  const seed = O(sc, SV.seed, 140, 180, 540, 960, {a:'c'}); gsap.set(seed, {y:-620, autoAlpha:1, scale:1.2});
  tl.to(seed, {y:0, duration:.55, ease:'power2.in'}, 17.35);
  const mound = O(sc, SV.mound, 760, 180, 540, 906); hide(mound); pop(mound, t0(35) - .05, .75, .45);

/* ---------- controlo ---------- */
const au = $('#au'), st = $('#start'), q = new URLSearchParams(location.search);
function play(){ st.style.display = 'none'; au.currentTime = 0; au.play().catch(() => {}); tl.play(0); }
if (q.has('t') || q.has('render')){
  st.style.display = 'none';
  const tt = parseFloat(q.get('t') || 0); for (let x = 0; x < tt; x += .04) tl.time(x); tl.time(tt); tl.pause();
} else {
  st.addEventListener('click', play);
  tl.eventCallback('onComplete', () => { st.querySelector('b').textContent = 'Rever'; st.style.display = 'flex'; });
  gsap.ticker.add(() => { if (!au.paused && tl.isActive() && Math.abs(au.currentTime - tl.time()) > .15) tl.time(au.currentTime, false); });
}
