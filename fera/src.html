<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Treino de Fera — Motion</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
/*FONTS*/
:root{--red:#e10600;--org:#ff6a00;--yel:#ffb800;--steel:#8a8f98;--bone:#f2ece4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;font-family:'Anton',Impact,sans-serif;background:#070505;color:var(--bone)}
#world{position:absolute;inset:0}
canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
#sym,#fx,#txt{position:absolute;inset:0;pointer-events:none}
.o{position:absolute;left:0;top:0}
.o svg{display:block;overflow:visible}
.tx{position:absolute;left:0;top:0;white-space:nowrap;line-height:1;text-transform:uppercase}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,transparent 38%,rgba(0,0,0,.78) 100%);pointer-events:none;z-index:30}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:55;pointer-events:none}
#redflash{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,60,0,.9),rgba(225,6,0,.6) 60%,transparent 100%);opacity:0;z-index:54;pointer-events:none}
#txt{z-index:40}
.line{position:absolute;left:30px;width:1020px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0 .26em;text-align:center;text-transform:uppercase;line-height:1.02;visibility:hidden;
  text-shadow:0 5px 0 rgba(0,0,0,.7),0 0 30px rgba(0,0,0,.9)}
.w{display:inline-block;transform-origin:50% 70%}
.w.e{padding:.2em .03em .02em;margin:-.2em 0 -.02em;background:linear-gradient(#fff2a8,#ffb800 45%,#ff4d00);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.65)) drop-shadow(0 0 22px rgba(255,90,0,.7))}
#pb{position:absolute;left:0;top:0;height:8px;width:1080px;background:linear-gradient(90deg,#e10600,#ffb800);transform-origin:0 0;transform:scaleX(0);z-index:70}
#start{position:absolute;inset:0;z-index:100;background:rgba(0,0,0,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;color:#f2ece4;cursor:pointer;text-align:center}
#start b{font-weight:400;font-size:190px;line-height:.95;text-transform:uppercase;color:#ff5a00;text-shadow:0 0 60px rgba(255,80,0,.6)}
#start span{font-size:54px;letter-spacing:6px;color:#f2ece4;text-transform:uppercase}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
 <linearGradient id="gFire" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd84a"/><stop offset=".5" stop-color="#ff6a00"/><stop offset="1" stop-color="#e10600"/></linearGradient>
 <linearGradient id="gSteel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8ecf2"/><stop offset=".5" stop-color="#8a8f98"/><stop offset="1" stop-color="#3b3f46"/></linearGradient>
 <linearGradient id="gDia" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6fbff"/><stop offset=".5" stop-color="#6fd6ff"/><stop offset="1" stop-color="#2a7bd6"/></linearGradient>
 <radialGradient id="gDoor" cx=".5" cy=".5" r=".7"><stop offset="0" stop-color="#fff6c8"/><stop offset="1" stop-color="#ff8a00"/></radialGradient>
</defs></svg>
<div id="stage">
  <div id="world">
    <canvas id="bg" width="1080" height="1920"></canvas>
    <div id="sym"></div>
    <div id="fx"></div>
  </div>
  <div id="txt"></div>
  <div id="vig"></div><div id="redflash"></div><div id="flash"></div>
  <div id="pb"></div>
  <div id="start"><b>Treino<br>de Fera</b><span>toque para assistir com som</span></div>
</div>
<audio id="au" src="audio.m4a" preload="auto"></audio>
<script>
const ENV = /*ENV*/;
const $ = s => document.querySelector(s);
const stage = $('#stage'), world = $('#world'), SYM = $('#sym'), FX = $('#fx'), TXT = $('#txt');
function fit(){ const s = Math.min(innerWidth/1080, innerHeight/1920); stage.style.transform = `translate(${(innerWidth-1080*s)/2}px,${(innerHeight-1920*s)/2}px) scale(${s})`; }
addEventListener('resize', fit); fit();
const DUR = 292;
const tl = gsap.timeline({paused:true}); window.__tl = tl;
const fr = t => Math.max(0, Math.min(ENV.n - 1, Math.floor(t*30)));
const bass = t => ENV.bass[fr(t)], rms = t => ENV.rms[fr(t)], beat = t => ENV.beat[fr(t)];
let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;

/* ---------- "calor" (intensidade visual) ao longo da música ---------- */
const HEAT = [[0,.15],[8,.3],[36,.35],[44,.45],[47.6,1],[54,.7],[97,1],[122,.45],[124,.75],[146,.7],[147,.2],[166,.25],[168.4,1],[172,.4],[182,.8],[200,.9],[205,1],[241,.7],[246,.45],[259,1],[272,.8],[278,.5],[292,0]];
function heat(t){ for (let i = 1; i < HEAT.length; i++) if (t <= HEAT[i][0]){ const a = HEAT[i-1], b = HEAT[i]; const k = (t - a[0])/(b[0] - a[0] || 1); return a[1] + (b[1] - a[1])*k; } return 0; }

/* ---------- fundo: fogo + brasas (função pura do tempo) ---------- */
const cv = $('#bg'), cx = cv.getContext('2d');
const EMB = Array.from({length:170}, () => ({x:rnd()*1080, sp:60 + rnd()*220, ph:rnd()*2000, sz:2 + rnd()*5, sw:20 + rnd()*60, fq:.5 + rnd()*2, hot:rnd()}));
const noise = (x, t) => Math.sin(x*.013 + t*3.1)*.5 + Math.sin(x*.031 - t*4.7)*.3 + Math.sin(x*.007 + t*1.3)*.2;
let mood = {tint:0};
function drawBG(t){
  const h = heat(t), b = bass(t), r = rms(t);
  const g = cx.createLinearGradient(0, 0, 0, 1920);
  const k = Math.min(1, h);
  g.addColorStop(0, `rgb(${7 + 8*k|0},${6},${8})`); g.addColorStop(.6, `rgb(${14 + 30*k|0},${6 + 4*k|0},${8})`); g.addColorStop(1, `rgb(${30 + 70*k*(.6 + b*.6)|0},${8 + 14*k|0},${6})`);
  cx.globalCompositeOperation = 'source-over'; cx.fillStyle = g; cx.fillRect(0, 0, 1080, 1920);
  // brilho central pulsando com o grave
  const rg = cx.createRadialGradient(540, 700, 20, 540, 700, 700);
  rg.addColorStop(0, `rgba(255,${70 + 80*h|0},0,${(.10 + .30*b)*h})`); rg.addColorStop(1, 'rgba(255,60,0,0)');
  cx.fillStyle = rg; cx.fillRect(0, 0, 1080, 1920);
  // fogo no rodapé
  cx.globalCompositeOperation = 'lighter';
  const base = 1920, amp = (40 + 330*h)*(.45 + b*.9 + r*.25);
  for (let layer = 0; layer < 3; layer++){
    const col = ['rgba(225,6,0,.55)', 'rgba(255,106,0,.55)', 'rgba(255,200,60,.5)'][layer], sc = [1, .72, .45][layer];
    cx.fillStyle = col; cx.beginPath(); cx.moveTo(0, base);
    for (let x = 0; x <= 1080; x += 18){ const n = noise(x + layer*200, t + layer*.37), hh = Math.max(6, amp*sc*(.55 + .5*n)*(.7 + .3*Math.sin(x*.004 + t))); cx.lineTo(x, base - hh); }
    cx.lineTo(1080, base); cx.closePath(); cx.fill();
  }
  // brasas
  const nEmb = Math.floor(30 + 140*Math.min(1, h + b*.25));
  for (let i = 0; i < nEmb; i++){ const p = EMB[i]; const y = 1980 - ((t*p.sp*(.6 + h) + p.ph) % 2100);
    const x = p.x + Math.sin(t*p.fq + p.ph)*p.sw; const a = Math.max(0, Math.min(1, (y/1900))) * (.4 + .6*Math.abs(Math.sin(t*3 + p.ph)));
    cx.fillStyle = p.hot > .5 ? `rgba(255,${150 + 80*p.hot|0},40,${a})` : `rgba(255,90,10,${a})`;
    cx.beginPath(); cx.arc(x, y, p.sz*(.6 + .6*b), 0, 6.283); cx.fill(); }
  cx.globalCompositeOperation = 'source-over';
}
const live = {t:0}; const CB = {v:.01}; const CK = 2.1;
tl.to(live, {t:DUR, duration:DUR, ease:'none', onUpdate(){
  const t = live.t; drawBG(t);
  const b = bass(t), bt = beat(t), h = heat(t);
  gsap.set(world, {scale:1 + .014*b*h + .010*bt*h});
  $('#vig').style.opacity = (.85 - .35*h*b).toFixed(2);
  if (window._core) gsap.set(window._core, {scale:CK*CB.v*(1 + .10*b + .06*bt)});
}}, 0);

/* ---------- helpers ---------- */
function H(parent, html, x, y, w, h, css = ''){ const d = document.createElement('div'); d.className = 'o'; d.style.cssText = `left:${x - w/2}px;top:${y - h/2}px;width:${w}px;height:${h}px;${css}`; d.innerHTML = html; parent.appendChild(d); return d; }
function TXD(parent, text, x, y, size, color, extra = ''){ const d = document.createElement('div'); d.className = 'tx'; d.textContent = text; d.style.cssText = `left:${x}px;top:${y}px;font-size:${size}px;color:${color};${extra}`; parent.appendChild(d); gsap.set(d, {xPercent:-50, yPercent:-50}); return d; }
const hide = (...e) => gsap.set(e.flat(), {autoAlpha:0, scale:0});
const ENTER = {
  pop:(e, t) => tl.to(e, {scale:1, autoAlpha:1, duration:.42, ease:'back.out(2.2)'}, t),
  slam:(e, t) => { gsap.set(e, {scale:3}); tl.to(e, {scale:1, autoAlpha:1, duration:.16, ease:'power4.in'}, t); shake(t + .16, 16); },
  drop:(e, t) => { gsap.set(e, {scale:1, y:-500}); tl.to(e, {y:0, autoAlpha:1, duration:.6, ease:'bounce.out'}, t); },
  right:(e, t) => { gsap.set(e, {scale:1, x:900}); tl.to(e, {x:0, autoAlpha:1, duration:.4, ease:'power3.out'}, t); },
  left:(e, t) => { gsap.set(e, {scale:1, x:-900}); tl.to(e, {x:0, autoAlpha:1, duration:.4, ease:'power3.out'}, t); },
  rise:(e, t) => { gsap.set(e, {scale:1, y:300}); tl.to(e, {y:0, autoAlpha:1, duration:.5, ease:'power3.out'}, t); },
  fade:(e, t) => tl.to(e, {scale:1, autoAlpha:1, duration:.4}, t)
};
function show(e, t0, t1, enter = 'pop'){ hide(e); (ENTER[enter] || ENTER.pop)(e, t0); if (t1) tl.to(e, {autoAlpha:0, scale:.85, duration:.2, ease:'power2.in'}, t1 - .2); return e; }
function shake(t, a = 14, n = 8){ tl.to(world, {x:`+=${a}`, y:`-=${a*.5}`, duration:.04, yoyo:true, repeat:n, ease:'none'}, t); tl.set(world, {x:0, y:0}, t + .04*(n + 1) + .01); }
function flash(t, a = .7, d = .35, red = false){ const f = red ? $('#redflash') : $('#flash'); tl.fromTo(f, {opacity:a}, {opacity:0, duration:d, ease:'power2.out', immediateRender:false}, t); }
function ring(t, x, y, color = '#ff6a00', R = 1100, d = .8, w = 14){ const r = H(FX, `<svg width="200" height="200" viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="none" stroke="${color}" stroke-width="${w}"/></svg>`, x, y, 200, 200); gsap.set(r, {scale:.2, autoAlpha:0});
  tl.set(r, {autoAlpha:1}, t); tl.to(r, {scale:R/100, autoAlpha:0, duration:d, ease:'power2.out'}, t); }
function sparks(t, x, y, n = 18, R = 420, color = '#ffb800'){ for (let i = 0; i < n; i++){ const s = H(FX, `<div style="width:${10 + (i%4)*5}px;height:${10 + (i%4)*5}px;background:${color};border-radius:2px;transform:rotate(${i*40}deg)"></div>`, x, y, 30, 30); gsap.set(s, {autoAlpha:0});
    const a = (i/n)*6.283 + (i%3)*.2, r = R*(.5 + (i%5)*.15); tl.set(s, {autoAlpha:1}, t); tl.to(s, {x:Math.cos(a)*r, y:Math.sin(a)*r + 80, rotation:360, autoAlpha:0, duration:.9 + (i%3)*.2, ease:'power2.out'}, t); } }

/* ---------- biblioteca de ícones (viewBox 200×200, cor via currentColor) ---------- */
const IC = {
 flame:`<svg width="200" height="200" viewBox="0 0 200 200"><path d="M100 8C122 50 172 70 162 132C157 172 127 192 100 192C70 192 40 172 40 132C40 100 60 90 70 60C85 80 90 50 100 8Z" fill="url(#gFire)"/><path d="M100 92C110 117 136 127 129 157C125 177 111 187 100 187C85 187 72 174 72 157C72 137 92 132 100 92Z" fill="#fff2a8"/></svg>`,
 bolt:`<svg width="200" height="200" viewBox="0 0 200 200"><path d="M120 6L36 112H96L72 194L168 80H108Z" fill="currentColor" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg>`,
 arrow:`<svg width="200" height="200" viewBox="0 0 200 200"><path d="M8 78H116V36L192 100L116 164V122H8Z" fill="currentColor" stroke="rgba(0,0,0,.4)" stroke-width="5" stroke-linejoin="round"/></svg>`,
 eye:`<svg width="200" height="200" viewBox="0 0 200 200"><path d="M8 100Q100 18 192 100Q100 182 8 100Z" fill="none" stroke="currentColor" stroke-width="14"/><circle cx="100" cy="100" r="32" fill="currentColor"/></svg>`,
 x:`<svg width="200" height="200" viewBox="0 0 200 200"><g stroke="#ff2a20" stroke-width="30" stroke-linecap="round"><path d="M30 30L170 170M170 30L30 170"/></g></svg>`,
 no:`<svg width="200" height="200" viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" fill="none" stroke="#ff2a20" stroke-width="20"/><path d="M38 162L162 38" stroke="#ff2a20" stroke-width="20" stroke-linecap="round"/></svg>`,
 sofa:`<svg width="200" height="200" viewBox="0 0 200 200"><g fill="currentColor"><rect x="30" y="60" width="140" height="60" rx="16"/><rect x="16" y="100" width="168" height="48" rx="14"/><rect x="2" y="84" width="40" height="76" rx="16"/><rect x="158" y="84" width="40" height="76" rx="16"/><rect x="34" y="150" width="12" height="26"/><rect x="154" y="150" width="12" height="26"/></g></svg>`,
 mountain:`<svg width="200" height="200" viewBox="0 0 200 200"><path d="M0 190L70 56L112 122L142 82L200 190Z" fill="currentColor"/><path d="M70 56V12" stroke="currentColor" stroke-width="8"/><path d="M70 12L116 28L70 44Z" fill="#ff2a20"/></svg>`,
 trophy:`<svg width="200" height="200" viewBox="0 0 200 200"><g fill="currentColor"><path d="M58 14H142V82C142 114 122 130 100 130C78 130 58 114 58 82Z"/><rect x="88" y="130" width="24" height="32"/><rect x="56" y="160" width="88" height="22" rx="8"/></g><g fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round"><path d="M58 34H26C26 74 42 90 62 94M142 34H174C174 74 158 90 138 94"/></g></svg>`,
 dumbbell:`<svg width="200" height="200" viewBox="0 0 200 200"><g fill="currentColor"><rect x="6" y="66" width="30" height="68" rx="8"/><rect x="36" y="50" width="24" height="100" rx="8"/><rect x="60" y="92" width="80" height="16"/><rect x="140" y="50" width="24" height="100" rx="8"/><rect x="164" y="66" width="30" height="68" rx="8"/></g></svg>`,
 clock:`<svg width="200" height="200" viewBox="0 0 200 200"><circle cx="100" cy="100" r="86" fill="none" stroke="currentColor" stroke-width="16"/><path d="M100 50V104L136 126" stroke="currentColor" stroke-width="14" stroke-linecap="round" fill="none"/></svg>`,
 person:`<svg width="200" height="200" viewBox="0 0 200 200"><g fill="currentColor"><circle cx="100" cy="28" r="22"/><path d="M62 62H138L150 126H124L118 192H82L76 126H50Z"/></g></svg>`,
 personUp:`<svg width="200" height="200" viewBox="0 0 200 200"><g fill="currentColor"><circle cx="100" cy="40" r="22"/><path d="M62 74H138L150 130H124L118 194H82L76 130H50Z"/><path d="M62 78L28 20L48 8L76 62Z"/><path d="M138 78L172 20L152 8L124 62Z"/></g></svg>`,
 door:`<svg width="200" height="200" viewBox="0 0 200 200"><rect x="40" y="10" width="120" height="184" rx="6" fill="none" stroke="currentColor" stroke-width="12"/><rect x="48" y="18" width="104" height="176" fill="url(#gDoor)" class="lt"/></svg>`,
 bars:`<svg width="200" height="200" viewBox="0 0 200 200"><g fill="currentColor"><rect x="8" y="10" width="184" height="14"/><rect x="8" y="176" width="184" height="14"/><rect x="30" y="10" width="14" height="180" class="b1"/><rect x="72" y="10" width="14" height="180" class="b2"/><rect x="114" y="10" width="14" height="180" class="b3"/><rect x="156" y="10" width="14" height="180" class="b4"/></g></svg>`,
 head:`<svg width="200" height="200" viewBox="0 0 200 200"><path d="M70 190V150C40 138 30 108 40 76C52 36 100 14 140 36C172 54 176 96 160 120L170 132L152 140V190Z" fill="currentColor"/><g stroke="#ffb800" stroke-width="10" stroke-linecap="round"><path d="M100 70V40M126 82L148 62M74 82L52 62"/></g></svg>`,
 bubble:`<svg width="200" height="200" viewBox="0 0 200 200"><path d="M20 20H180V130H110L70 176V130H20Z" fill="currentColor" stroke="rgba(0,0,0,.4)" stroke-width="6" stroke-linejoin="round"/></svg>`,
 reset:`<svg width="200" height="200" viewBox="0 0 200 200"><path d="M62 40A76 76 0 1 0 138 40" fill="none" stroke="currentColor" stroke-width="18" stroke-linecap="round"/><path d="M100 10V92" stroke="currentColor" stroke-width="18" stroke-linecap="round"/></svg>`,
 diamond:`<svg width="200" height="200" viewBox="0 0 200 200"><path d="M50 36H150L192 84L100 192L8 84Z" fill="url(#gDia)" stroke="#fff" stroke-width="6" stroke-linejoin="round"/><path d="M8 84H192M50 36L80 84L100 36L120 84L150 36M80 84L100 192L120 84" fill="none" stroke="#fff" stroke-width="4" opacity=".8"/></svg>`,
 rock:`<svg width="200" height="200" viewBox="0 0 200 200"><path d="M30 60L80 24L150 36L184 100L160 168L84 184L26 140Z" fill="#26282c" stroke="#555a62" stroke-width="8" stroke-linejoin="round"/></svg>`,
 magnifier:`<svg width="200" height="200" viewBox="0 0 200 200"><circle cx="82" cy="82" r="60" fill="rgba(255,255,255,.08)" stroke="currentColor" stroke-width="16"/><path d="M126 126L184 184" stroke="currentColor" stroke-width="22" stroke-linecap="round"/></svg>`,
 foot:`<svg width="200" height="200" viewBox="0 0 200 200"><g fill="currentColor"><ellipse cx="68" cy="130" rx="26" ry="48" transform="rotate(-8 68 130)"/><ellipse cx="60" cy="62" rx="22" ry="16"/><ellipse cx="140" cy="100" rx="26" ry="48" transform="rotate(8 140 100)"/><ellipse cx="148" cy="32" rx="22" ry="16"/></g></svg>`,
 lock:`<svg width="200" height="200" viewBox="0 0 200 200"><path d="M56 90V64C56 18 144 18 144 64V90" fill="none" stroke="currentColor" stroke-width="18" stroke-linecap="round"/><rect x="26" y="86" width="148" height="104" rx="18" fill="currentColor"/><circle cx="100" cy="132" r="14" fill="#111"/><rect x="94" y="136" width="12" height="30" fill="#111"/></svg>`,
 check:`<svg width="200" height="200" viewBox="0 0 200 200"><path d="M24 108L80 164L178 40" fill="none" stroke="currentColor" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
 sun:`<svg width="200" height="200" viewBox="0 0 200 200"><g stroke="#ffb800" stroke-width="12" stroke-linecap="round"><path d="M100 4V36M100 164V196M4 100H36M164 100H196M32 32L54 54M146 146L168 168M168 32L146 54M54 146L32 168"/></g><circle cx="100" cy="100" r="52" fill="#ffd84a"/></svg>`
};
const ico = (name, w, color, x, y, css = '') => { const d = H(SYM, IC[name], x, y, 200, 200, `color:${color};${css}`); gsap.set(d, {scale:w/200}); d._s = w/200; return d; };
function sym(name, t0, t1, o = {}){ const w = o.w || 360, d = ico(name, w, o.color || '#f2ece4', o.x ?? 540, o.y ?? 640, o.css || ''); const s = d._s;
  gsap.set(d, {autoAlpha:0, scale:0, rotation:o.rot || 0}); const en = o.enter || 'pop';
  const ent = {
    pop:() => tl.to(d, {scale:s, autoAlpha:1, duration:.42, ease:'back.out(2.2)'}, t0),
    slam:() => { gsap.set(d, {scale:s*3}); tl.to(d, {scale:s, autoAlpha:1, duration:.16, ease:'power4.in'}, t0); shake(t0 + .16, 14); },
    drop:() => { gsap.set(d, {scale:s, y:-520}); tl.to(d, {y:0, autoAlpha:1, duration:.6, ease:'bounce.out'}, t0); },
    right:() => { gsap.set(d, {scale:s, x:900}); tl.to(d, {x:0, autoAlpha:1, duration:.4, ease:'power3.out'}, t0); },
    left:() => { gsap.set(d, {scale:s, x:-900}); tl.to(d, {x:0, autoAlpha:1, duration:.4, ease:'power3.out'}, t0); },
    rise:() => { gsap.set(d, {scale:s, y:300}); tl.to(d, {y:0, autoAlpha:1, duration:.5, ease:'power3.out'}, t0); }
  }; (ent[en] || ent.pop)();
  if (o.pulse) tl.to(d, {scale:s*1.08, duration:.3, yoyo:true, repeat:Math.max(1, Math.floor((t1 - t0)/.6)), ease:'sine.inOut'}, t0 + .5);
  if (t1) tl.to(d, {autoAlpha:0, scale:s*.85, duration:.2, ease:'power2.in'}, t1 - .2);
  return d; }
const crossAt = (t, t1, x, y, w = 320) => sym('x', t, t1, {x, y, w, enter:'slam'});

/* ======================================================================
   ATOS (visual)
   ====================================================================== */
/* Ato 1 · força contida (0 – 44) */
const coreGlow = H(SYM, '<div style="width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,rgba(255,120,0,.55),rgba(255,60,0,.15) 55%,transparent 72%)"></div>', 540, 660, 640, 640);
const core = ico('flame', 420, '#fff', 540, 660); window._core = core;  gsap.set(coreGlow, {autoAlpha:0, scale:.2});
