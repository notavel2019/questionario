<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CalculaExato — Motion</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
/*FONTS*/
:root{--navy:#111827;--ink:#1a2233;--teal:#0f9488;--teal2:#2dd4bf;--green:#16a34a;--green2:#4ade80;--red:#ef4444;--red2:#ff6b6b;--gold:#fbbf24;--light:#eef4f2}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050806;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;font-family:'Montserrat',Arial,sans-serif;background:#0f172a}
#world{position:absolute;inset:0}
.sc{position:absolute;inset:0;visibility:hidden;overflow:hidden}
.o{position:absolute;left:0;top:0}
.tx{position:absolute;left:0;top:0;white-space:nowrap;line-height:1}
.bc{font-family:'BC','Barlow Condensed',Impact,sans-serif;font-weight:800;text-transform:uppercase}
.m8{font-weight:800}.m6{font-weight:600}
.card{position:absolute;background:#fff;border-radius:28px;box-shadow:0 18px 50px rgba(15,23,42,.25)}
.frame{position:absolute;overflow:hidden;border-radius:28px;background:#fff;box-shadow:0 22px 60px rgba(15,23,42,.35);border:2px solid rgba(15,23,42,.08)}
.wr{position:absolute;left:0;top:0;transform-origin:0 0}
.wr img{display:block}
.hl{position:absolute;border:6px solid var(--red);border-radius:16px;box-shadow:0 0 0 6px rgba(239,68,68,.22),0 0 30px rgba(239,68,68,.55)}
.logo{position:absolute;left:0;top:0;display:flex;align-items:center;gap:14px;white-space:nowrap}
.logo b{font-weight:800;font-size:76px;color:#1a2233;letter-spacing:-2px}
.logo b span{color:var(--teal)}
.logo i{font-style:normal;font-weight:600;font-size:26px;color:#64748b;margin-left:-6px;align-self:flex-end;margin-bottom:10px}
#scrim{position:absolute;left:0;top:1230px;width:1080px;height:690px;background:linear-gradient(rgba(8,12,24,0),rgba(8,12,24,.93) 55%);z-index:40;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(0,0,0,.35) 100%);pointer-events:none;z-index:45}
#cap{position:absolute;left:40px;width:1000px;top:1400px;height:340px;z-index:60;pointer-events:none}
.chunk{position:absolute;inset:0;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:0 .24em;text-align:center;color:#fff;line-height:1.02;
  text-shadow:0 5px 0 rgba(0,0,0,.5),0 0 26px rgba(0,0,0,.7);visibility:hidden}
.w{display:inline-block;transform-origin:50% 75%}
#pb{position:absolute;left:0;top:0;height:8px;width:1080px;background:var(--teal2);transform-origin:0 0;transform:scaleX(0);z-index:70}
#start{position:absolute;inset:0;z-index:100;background:rgba(5,8,6,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;color:#fff;cursor:pointer}
#start b{font-weight:800;font-size:120px;line-height:1}
#start span{font-size:48px;color:var(--teal2);font-weight:600}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe58f"/><stop offset="1" stop-color="#f4a21f"/></linearGradient>
  <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0f9488"/></linearGradient>
</defs></svg>
<div id="stage">
  <div id="world"></div>
  <div id="scrim"></div><div id="vig"></div>
  <div id="cap"></div>
  <div id="pb"></div>
  <div id="start"><b>CalculaExato</b><span>toque para assistir com som</span></div>
</div>
<audio id="au" src="audio.m4a" preload="auto"></audio>

<script>
const WORDS = /*WORDS*/;
const END = 46;
const $ = s => document.querySelector(s);
const stage = $('#stage'), world = $('#world');
function fit(){ const s = Math.min(innerWidth/1080, innerHeight/1920);
  stage.style.transform = `translate(${(innerWidth-1080*s)/2}px,${(innerHeight-1920*s)/2}px) scale(${s})`; }
addEventListener('resize', fit); fit();
const t0 = i => WORDS[i][0], t1 = i => WORDS[i][1];
const TXT = WORDS.map(w => w[2].trim());
TXT[28] = 'Calcula'; TXT[29] = 'Exato,'; TXT[91] = 'calculaexato.com.br'; TXT[92] = ''; TXT[93] = '';

const tl = gsap.timeline({paused:true}); window.__tl = tl;
const brl = n => { const s = Math.abs(n).toFixed(2).split('.'); return (n < 0 ? '−' : '') + 'R$ ' + s[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + s[1]; };

/* ---------- helpers ---------- */
function mkScene(bg){ const d = document.createElement('div'); d.className = 'sc'; d.style.background = bg; world.appendChild(d); return d; }
function scene(sc, a, b){ gsap.set(sc, {autoAlpha:0}); tl.to(sc, {autoAlpha:1, duration:.3, ease:'none'}, a - .1); if (b < END) tl.to(sc, {autoAlpha:0, duration:.3, ease:'none'}, b - .1); }
function H(sc, html, x, y, css = '', cls = ''){ const d = document.createElement('div'); d.className = 'o ' + cls; d.style.cssText = `left:${x}px;top:${y}px;${css}`; d.innerHTML = html; sc.appendChild(d); return d; }
function TX(sc, text, x, y, size, color, cls = 'm8', extra = ''){ const d = document.createElement('div'); d.className = 'tx ' + cls; d.textContent = text; d.style.cssText = `left:${x}px;top:${y}px;font-size:${size}px;color:${color};${extra}`; sc.appendChild(d); gsap.set(d, {xPercent:-50, yPercent:-50}); return d; }
const hide = (...e) => gsap.set(e.flat(), {scale:0, autoAlpha:0});
const pop = (e, t, s = 1, d = .5, ease = 'back.out(2.2)') => tl.to(e, {scale:s, autoAlpha:1, duration:d, ease}, t);
const fadeOut = (e, t, d = .25) => tl.to(e, {autoAlpha:0, duration:d}, t);
function glow(sc, x, y, r, color){ const d = document.createElement('div'); d.className = 'o'; d.style.cssText = `width:${r*2}px;height:${r*2}px;left:${x-r}px;top:${y-r}px;border-radius:50%;background:radial-gradient(circle,${color} 0%,transparent 68%)`; sc.appendChild(d); return d; }
function count(el, from, to, t, dur, color){ const o = {v:from}; el.textContent = brl(from);
  tl.to(o, {v:to, duration:dur, ease:'power2.out', onUpdate:() => { el.textContent = brl(o.v); if (color) el.style.color = color(o.v); }}, t); }
function typeLine(el, text, t, dur){ const o = {n:0}; el.textContent = ''; tl.to(o, {n:text.length, duration:dur, ease:'none', onUpdate:() => { el.textContent = text.slice(0, Math.round(o.n)); }}, t); }
function sparkles(sc, x, y, t, n = 8, R = 240, color = '#fde68a'){
  for (let i = 0; i < n; i++){
    const s = H(sc, `<svg width="50" height="50" viewBox="0 0 60 60"><path d="M30 0C33 20 40 27 60 30C40 33 33 40 30 60C27 40 20 33 0 30C20 27 27 20 30 0Z" fill="${color}"/></svg>`, x - 25, y - 25); hide(s);
    const a = i/n*Math.PI*2 + .4, r = R*(.6 + (i%3)*.25);
    tl.to(s, {x:Math.cos(a)*r, y:Math.sin(a)*r, scale:.5 + (i%3)*.35, autoAlpha:1, rotation:90, duration:.5, ease:'power2.out'}, t + i*.03);
    tl.to(s, {autoAlpha:0, scale:0, duration:.4}, t + .55 + i*.03);
  }
}
const punch = t => tl.fromTo(world, {scale:1.03}, {scale:1, duration:.4, ease:'power2.out', immediateRender:false}, t);

/* frame com screenshot: região em coordenadas da imagem */
function mkFrame(sc, img, iw, ih, x, y, FW, region){
  const [rx, ry, rw, rh] = region, s = FW/rw;
  const fr = document.createElement('div'); fr.className = 'frame'; fr.style.cssText = `left:${x}px;top:${y}px;width:${FW}px;height:${Math.round(rh*s)}px`;
  const wr = document.createElement('div'); wr.className = 'wr'; wr.style.cssText = `width:${iw}px;height:${ih}px`;
  wr.innerHTML = `<img src="img/${img}" width="${iw}" height="${ih}" alt="">`;
  fr.appendChild(wr); sc.appendChild(fr);
  gsap.set(wr, {scale:s, x:-rx*s, y:-ry*s});
  fr._wr = wr; fr._FW = FW; return fr;
}
function view(fr, region, t, d = .8, ease = 'power3.inOut'){ const [rx, ry, rw] = region, s = fr._FW/rw; tl.to(fr._wr, {scale:s, x:-rx*s, y:-ry*s, duration:d, ease}, t); }
function hl(fr, x, y, w, h, t, o = {}){ const d = document.createElement('div'); d.className = 'hl';
  d.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;` + (o.color ? `border-color:${o.color};box-shadow:0 0 0 6px ${o.color}33,0 0 30px ${o.color}99;` : '');
  fr._wr.appendChild(d); gsap.set(d, {scale:.9, autoAlpha:0}); tl.to(d, {scale:1, autoAlpha:1, duration:.3, ease:'back.out(2)'}, t);
  if (o.pulse) tl.to(d, {scale:1.04, duration:.35, yoyo:true, repeat:o.pulse, ease:'sine.inOut'}, t + .3);
  if (o.out) tl.to(d, {autoAlpha:0, duration:.2}, o.out);
  return d; }
const LOGO = `<svg width="86" height="76" viewBox="0 0 86 76"><rect x="4" y="44" width="16" height="30" rx="4" fill="#0f9488"/><rect x="26" y="30" width="16" height="44" rx="4" fill="#16a34a"/><rect x="48" y="38" width="16" height="36" rx="4" fill="#2dd4bf"/><path d="M4 30L28 14L44 22L78 2" stroke="#16a34a" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M62 2H80V20" stroke="#16a34a" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Calcula<span>Exato</span></b><i>.com.br</i>`;
const logoEl = (sc, x, y, s = 1) => { const l = H(sc, LOGO, 0, 0, '', 'logo'); gsap.set(l, {x:x, y:y, xPercent:-50, yPercent:-50, scale:s}); return l; };

/* ================= CENAS ================= */
/* 1 · vende, vende, mas o dinheiro não sobra? (0 – 4.2) */
{ const sc = mkScene('#0f172a'); scene(sc, 0, 4.2);
  const g = glow(sc, 540, 620, 700, 'rgba(15,148,136,.25)');
  const card = (i, t, name, valor) => { const c = H(sc, `<div style="display:flex;align-items:center;gap:26px;height:100%;padding:0 36px"><div style="width:68px;height:68px;border-radius:50%;background:#16a34a;display:flex;align-items:center;justify-content:center"><svg width="38" height="38" viewBox="0 0 38 38"><path d="M6 20L16 30L33 9" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div style="flex:1"><div class="m8" style="font-size:38px;color:#111827">${name}</div><div class="m6" style="font-size:26px;color:#64748b">Pedido pago</div></div><div class="m8" style="font-size:46px;color:#16a34a">${valor}</div></div>`, 100, 250 + i*150, 'width:880px;height:124px', 'card');
    gsap.set(c, {x:1200}); tl.to(c, {x:0, duration:.5, ease:'back.out(1.6)'}, t); return c; };
  const c1 = card(0, t0(1) - .1, 'Venda #4821', '+ R$ 42,90'), c2 = card(1, t0(2) - .1, 'Venda #4822', '+ R$ 68,00'), c3 = card(2, t0(3) - .05, 'Venda #4823', '+ R$ 54,90');
  [c1, c2, c3].forEach((c, i) => tl.fromTo(c, {scale:1.06}, {scale:1, duration:.3, ease:'power2.out', immediateRender:false}, t0(i + 1)));
  const panel = H(sc, `<div class="m6" style="font-size:30px;color:#94a3b8;letter-spacing:3px;margin:34px 0 0 44px">SALDO DO MÊS</div><div class="m8" id="saldo" style="font-size:118px;color:#fff;margin:6px 0 0 44px;white-space:nowrap">R$ 5.240,00</div>`, 100, 780, 'width:880px;height:290px;background:#1e293b;border-radius:34px;border:2px solid #334155');
  hide(panel); pop(panel, t0(5) - .1, 1, .5);
  const sd = panel.querySelector('#saldo'); const o = {v:5240};
  tl.to(o, {v:0, duration:1.0, ease:'power2.in', onUpdate:() => { sd.textContent = brl(o.v); sd.style.color = o.v < 1000 ? '#ef4444' : '#fff'; }}, t0(6) - .1);
  for (let i = 0; i < 14; i++){ const co = H(sc, '<svg width="56" height="56" viewBox="0 0 56 56"><circle cx="28" cy="28" r="25" fill="url(#gGold)" stroke="#b97a12" stroke-width="4"/><text x="28" y="38" text-anchor="middle" font-size="30" font-weight="800" fill="#b97a12" font-family="Montserrat">$</text></svg>', 160 + (i*61)%760, 960); hide(co);
    tl.set(co, {scale:1, autoAlpha:1}, t0(6) + i*.045); tl.to(co, {y:700, x:(i%2 ? 40 : -40), rotation:(i%2 ? 220 : -220), duration:.9, ease:'power2.in'}, t0(6) + i*.045); tl.to(co, {autoAlpha:0, duration:.1}, t0(6) + i*.045 + .85); }
  const q = TX(sc, '?', 880, 760, 300, '#ef4444'); hide(q); pop(q, t0(7) - .05, 1, .5, 'elastic.out(1,.5)'); tl.to(q, {rotation:10, duration:.2, yoyo:true, repeat:5, ease:'sine.inOut'}, t0(7) + .5);
  const dim = glow(sc, 540, 900, 900, 'rgba(239,68,68,.28)'); gsap.set(dim, {autoAlpha:0}); tl.to(dim, {autoAlpha:1, duration:.4}, t0(6));
  punch(t0(6));
}
/* 2 · prejuízo escondido no preço: Comissão, frete, imposto, custo esquecido (4.2 – 13.4) */
{ const sc = mkScene('#0f172a'); scene(sc, 4.2, 13.4);
  glow(sc, 540, 700, 700, 'rgba(15,148,136,.2)');
  const lab = TX(sc, 'PREÇO DE VENDA', 540, 235, 34, '#94a3b8', 'm6', 'letter-spacing:6px'); hide(lab); pop(lab, 4.3, 1, .4);
  const tag = H(sc, `<div class="m8" style="font-size:132px;color:#111827;text-align:center;line-height:210px">R$ 42,90</div><div style="position:absolute;left:34px;top:92px;width:26px;height:26px;border-radius:50%;background:#0f172a"></div>`, 190, 290, 'width:700px;height:210px;background:#fff;border-radius:40px;box-shadow:0 20px 60px rgba(0,0,0,.5)'); hide(tag); pop(tag, t0(8) - .05, 1, .55);
  const mag = H(sc, '<svg width="170" height="190" viewBox="0 0 170 190"><circle cx="76" cy="76" r="60" fill="rgba(45,212,191,.18)" stroke="#2dd4bf" stroke-width="14"/><path d="M122 124L160 178" stroke="#2dd4bf" stroke-width="18" stroke-linecap="round"/></svg>', 100, 330); hide(mag);
  tl.set(mag, {scale:1, autoAlpha:1}, t0(11)); tl.to(mag, {x:560, duration:1.1, ease:'sine.inOut'}, t0(11)); tl.to(mag, {autoAlpha:0, scale:.6, duration:.25}, t0(14) - .1);
  const rows = [
    ['Custo do produto', '− R$ 18,40', '#94a3b8', 24.50, 6.9],
    ['Comissão', '− R$ 8,58', '#fb923c', 15.92, t0(16) - .05],
    ['Frete', '− R$ 9,90', '#60a5fa', 6.02, t0(17) - .05],
    ['Imposto', '− R$ 2,57', '#a78bfa', 3.45, t0(18) - .05],
    ['Custo esquecido', '− R$ 4,20', '#ef4444', -0.75, t0(20) - .05]];
  const total = H(sc, `<div class="m6" style="font-size:28px;color:#94a3b8;letter-spacing:4px;margin:20px 0 0 40px">O QUE SOBRA</div><div class="m8" id="tot" style="font-size:96px;color:#fff;margin:0 0 0 40px;white-space:nowrap">R$ 42,90</div>`, 100, 1100, 'width:880px;height:150px;background:#1e293b;border-radius:30px;border:2px solid #334155');
  hide(total); pop(total, t0(8) + .3, 1, .4); const tot = total.querySelector('#tot'); let prev = 42.90;
  const col = v => v < 0 ? '#ef4444' : v < 10 ? '#fbbf24' : '#4ade80';
  rows.forEach(([name, val, c, after, t], i) => {
    const y = 535 + i*112;
    const r = H(sc, `<div style="display:flex;align-items:center;height:100%;padding:0 30px;gap:22px"><div style="width:16px;height:60px;border-radius:8px;background:${c}"></div><div class="m8" style="flex:1;font-size:40px;color:#fff">${name}</div><div class="m8" style="font-size:44px;color:${c}">${val}</div></div>`, 100, y, `width:880px;height:92px;background:#1e293b;border-radius:24px;${i === 4 ? 'border:3px dashed #ef4444' : 'border:2px solid #334155'}`);
    gsap.set(r, {x:-1100}); tl.to(r, {x:0, duration:.45, ease:'back.out(1.5)'}, t);
    const o = {v:prev}; const p0 = prev; tl.to(o, {v:after, duration:.5, ease:'power2.out', onUpdate:() => { tot.textContent = brl(o.v); tot.style.color = col(o.v); }}, t + .1); prev = after;
    if (i === 4){ tl.to(r, {x:'+=14', duration:.06, yoyo:true, repeat:9, ease:'none'}, t + .5); }
  });
  const note = TX(sc, 'exemplo ilustrativo', 540, 1290, 28, '#64748b', 'm6'); hide(note); pop(note, 7.0, 1, .3);
  const st = H(sc, `<div class="m8" style="font-size:150px;color:#ef4444;border:14px solid #ef4444;border-radius:28px;padding:10px 40px;background:rgba(15,23,42,.85);white-space:nowrap">PREJUÍZO</div>`, 540, 800, ''); gsap.set(st, {xPercent:-50, yPercent:-50, rotation:-9, scale:3, autoAlpha:0});
  tl.to(st, {scale:1, autoAlpha:1, duration:.25, ease:'power4.in'}, t0(25) - .45); punch(t0(25) - .2);
  const flash = glow(sc, 540, 900, 900, 'rgba(239,68,68,.4)'); gsap.set(flash, {autoAlpha:0}); tl.to(flash, {autoAlpha:1, duration:.15, yoyo:true, repeat:3}, t0(24));
}
/* 3 · Calcula Exato: 6 marketplaces, uma calculadora, duas margens, decidir (13.4 – 23.2) */
{ const sc = mkScene('#eef4f2'); scene(sc, 13.4, 23.2);
  glow(sc, 540, 500, 800, 'rgba(45,212,191,.35)');
  const lg = logoEl(sc, 540, 800, 1.7); hide(lg); gsap.set(lg, {xPercent:-50, yPercent:-50}); tl.to(lg, {scale:1.7, autoAlpha:1, duration:.6, ease:'back.out(1.8)'}, t0(26));
  sparkles(sc, 540, 800, t0(28), 8, 380, '#2dd4bf');
  tl.to(lg, {y:150, scale:.95, duration:.7, ease:'power3.inOut'}, t0(30) - .1);
  const MP = [['AMAZON (DBA)', '#fff7ed', '#f97316', '#c2410c'], ['SHOPEE', '#fdf2f8', '#ec4899', '#be185d'], ['TIKTOK SHOP', '#f0fdfa', '#14b8a6', '#0f766e'], ['MERCADO LIVRE', '#fffbeb', '#d97706', '#b45309'], ['SHEIN', '#f5f3ff', '#8b5cf6', '#6d28d9'], ['TEMU', '#fef2f2', '#ef4444', '#b91c1c']];
  const chips = MP.map(([n, bg, bd, tc], i) => { const cx = 195 + (i%3)*345, cy = 360 + Math.floor(i/3)*130;
    const c = H(sc, `<div class="bc" style="display:flex;align-items:center;justify-content:center;gap:12px;height:100%;font-size:40px;color:${tc}"><span style="width:38px;height:38px;border-radius:50%;background:${tc};display:inline-flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 38 38"><path d="M6 20L16 30L33 9" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>${n}</div>`, cx - 160, cy - 52, `width:320px;height:104px;background:${bg};border:5px solid ${bd};border-radius:60px;box-shadow:0 10px 26px rgba(15,23,42,.12)`);
    hide(c); pop(c, t0(33) + i*.17, 1, .45); return c; });
  const six = TX(sc, '6', 540, 690, 260, '#0f9488', 'm8'); hide(six); pop(six, t0(33), 1, .5, 'elastic.out(1,.5)');
  /* frame: marketplaces */
  const f1 = mkFrame(sc, 'marketplaces.png', 1398, 829, 60, 330, 960, [55, 140, 800, 330]); hide(f1);
  tl.to(chips, {y:720, scale:.72, duration:.55, ease:'power3.inOut'}, t0(35) - .05);
  tl.to(six, {autoAlpha:0, scale:.4, duration:.25}, t0(35) - .1);
  tl.to(f1, {scale:1, autoAlpha:1, duration:.55, ease:'back.out(1.5)'}, t0(35) + .05);
  hl(f1._wr.parentNode._wr ? f1 : f1, 62, 218, 790, 118, t0(36) + .1, {color:'#0f9488', pulse:3});
  const uni = TX(sc, 'TUDO EM UMA CALCULADORA', 540, 1010, 50, '#0f766e', 'm8'); hide(uni); pop(uni, t0(37), 1, .5);
  /* frame: margens */
  const f2 = mkFrame(sc, 'margem.png', 1420, 819, 60, 330, 960, [60, 335, 560, 235]); hide(f2);
  tl.to(f1, {autoAlpha:0, scale:.9, duration:.3}, t0(39) - .15); tl.to([chips, uni], {autoAlpha:0, duration:.25}, t0(39) - .15);
  tl.to(f2, {scale:1, autoAlpha:1, duration:.55, ease:'back.out(1.5)'}, t0(39));
