:root{--deep:#1f3a21;--green:#2f5a30;--green2:#3f6e3b;--pink:#ffa8bb;--cream:#f4efe2;--gold:#f2c14e;--red:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050804;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;font-family:'Montserrat',Arial,sans-serif;background:var(--deep);color:var(--cream)}
#world{position:absolute;inset:0}
.sc{position:absolute;inset:0;visibility:hidden;overflow:hidden}
.sc::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.07) 2px,transparent 2.6px);background-size:54px 54px;pointer-events:none}
.o{position:absolute;left:0;top:0}
.tx{position:absolute;left:0;top:0;white-space:nowrap;line-height:1}
.m{font-weight:800}
.serif{font-family:'IS','Instrument Serif',Georgia,serif;font-style:italic;font-weight:400}
.up{text-transform:uppercase}
#scrim{position:absolute;left:0;top:1240px;width:1080px;height:680px;background:linear-gradient(rgba(10,18,11,0),rgba(10,18,11,.92) 55%);z-index:40;pointer-events:none}
#cap{position:absolute;left:40px;width:1000px;top:1400px;height:360px;z-index:60;pointer-events:none}
.chunk{position:absolute;inset:0;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:0 .3em;text-align:center;color:#fff;line-height:1.08;text-transform:uppercase;font-weight:800;text-shadow:0 4px 0 rgba(0,0,0,.45),0 0 24px rgba(0,0,0,.6);visibility:hidden}

#start b{font-family:'IS',Georgia,serif;font-style:italic;font-weight:400;font-size:230px;line-height:1}
#start span{font-weight:800;font-size:46px;color:var(--pink);letter-spacing:3px;text-transform:uppercase}

</head>
<body>
<div id="stage">
  <div id="world"></div>
  <div id="scrim"></div>
  <div id="cap"></div>
  <div id="pb"></div>
  <div id="start"><b>Bazar</b><span>toque para assistir</span></div>
</div>
<script>
const $ = s => document.querySelector(s);
const stage = $('#stage'), world = $('#world');
function fit(){ const s = Math.min(innerWidth/1080, innerHeight/1920); stage.style.transform = `translate(${(innerWidth-1080*s)/2}px,${(innerHeight-1920*s)/2}px) scale(${s})`; }
addEventListener('resize', fit); fit();
const END = 30;
const tl = gsap.timeline({paused:true}); window.__tl = tl;

/* ---------- helpers ---------- */
function mkScene(bg){ const d = document.createElement('div'); d.className = 'sc'; d.style.background = bg; world.appendChild(d); gsap.set(d, {autoAlpha:0}); return d; }
function scene(sc, a, b){ if (a < .2) tl.set(sc, {autoAlpha:1}, 0); else tl.to(sc, {autoAlpha:1, duration:.3, ease:'none'}, a - .1); if (b < END) tl.to(sc, {autoAlpha:0, duration:.3, ease:'none'}, b - .1); }
function H(sc, html, x, y, css = '', cls = ''){ const d = document.createElement('div'); d.className = 'o ' + cls; d.style.cssText = `left:${x}px;top:${y}px;${css}`; d.innerHTML = html; sc.appendChild(d); return d; }

  const spans = words.map((w, i) => { const s = document.createElement('span'); s.className = 'w' + (c.e[i] ? ' e' : ''); s.textContent = w;
    if (c.e[i]){ s.style.color = '#ffa8bb'; s.style.fontSize = '1.5em'; } el.appendChild(s);
    const at = c.t[0] + (cum/total)*(c.t[1] - c.t[0])*.92; cum += w.length + 1; return [s, at, !!c.e[i]]; });
  gsap.set(spans.map(x => x[0]), {autoAlpha:.18, scale:.8, y:10});
  tl.set(el, {autoAlpha:1}, c.t[0] - .05);
  spans.forEach(([s, at, em]) => tl.to(s, em ? {autoAlpha:1, scale:1, y:0, duration:.5, ease:'elastic.out(1,.5)'} : {autoAlpha:1, scale:1, y:0, duration:.2, ease:'back.out(3)'}, at));
  tl.to(el, {autoAlpha:0, duration:.08}, c.t[1] + .25);
});
tl.fromTo('#pb', {scaleX:0}, {scaleX:1, duration:END, ease:'none'}, 0);
tl.set({}, {}, END);

/* ---------- controlo ---------- */
const st = $('#start'), q = new URLSearchParams(location.search);
function init(){
  if (q.has('t') || q.has('render')){ st.style.display = 'none'; const tt = parseFloat(q.get('t') || 0); for (let x = 0; x < tt; x += .04) tl.time(x); tl.time(tt); tl.pause(); }
  else { st.addEventListener('click', () => { st.style.display = 'none'; tl.play(0); }); tl.eventCallback('onComplete', () => { st.querySelector('b').textContent = 'Rever'; st.style.display = 'flex'; }); }
}
Promise.race([Promise.all([document.fonts.load('800 60px Montserrat', 'A'), document.fonts.load('italic 100px IS', 'a')]), new Promise(r => setTimeout(r, 3000))]).then(() => requestAnimationFrame(init));
</script>
