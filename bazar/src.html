<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bazar Bola de Neve Jaraguá — Motion</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
/*FONTS*/
:root{--deep:#1f3a21;--green:#2f5a30;--green2:#3f6e3b;--pink:#ffa8bb;--cream:#f4efe2;--gold:#f2c14e;--red:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050804;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;font-family:'Montserrat',Arial,sans-serif;background:var(--deep);color:var(--cream)}
#world{position:absolute;inset:0}
.sc{position:absolute;inset:0;visibility:hidden;overflow:hidden}
.sc::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.07) 2px,transparent 2.6px);background-size:54px 54px;pointer-events:none}
.o{position:absolute;left:0;top:0}
.tx{position:absolute;left:0;top:0;white-space:nowrap;line-height:1}
.m{font-weight:800}
.serif{font-family:'IS','Instrument Serif',Georgia,serif;font-style:italic;font-weight:400}
.up{text-transform:uppercase}
#scrim{position:absolute;left:0;top:1240px;width:1080px;height:680px;background:linear-gradient(rgba(10,18,11,0),rgba(10,18,11,.92) 55%);z-index:40;pointer-events:none}
#cap{position:absolute;left:40px;width:1000px;top:1400px;height:360px;z-index:60;pointer-events:none}
.chunk{position:absolute;inset:0;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:0 .3em;text-align:center;color:#fff;line-height:1.08;text-transform:uppercase;font-weight:800;text-shadow:0 4px 0 rgba(0,0,0,.45),0 0 24px rgba(0,0,0,.6);visibility:hidden}
.w{display:inline-block;transform-origin:50% 75%}
.w.e{font-family:'IS','Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;text-transform:none}
#pb{position:absolute;left:0;top:0;height:8px;width:1080px;background:var(--pink);transform-origin:0 0;transform:scaleX(0);z-index:70}
#start{position:absolute;inset:0;z-index:100;background:rgba(5,8,4,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;color:var(--cream);cursor:pointer;text-align:center}
#start b{font-family:'IS',Georgia,serif;font-style:italic;font-weight:400;font-size:230px;line-height:1}
#start span{font-weight:800;font-size:46px;color:var(--pink);letter-spacing:3px;text-transform:uppercase}
</style>
</head>
<body>
<div id="stage">
  <div id="world"></div>
  <div id="scrim"></div>
  <div id="cap"></div>
  <div id="pb"></div>
  <div id="start"><b>Bazar</b><span>toque para assistir</span></div>
</div>
<script>
const $ = s => document.querySelector(s);
const stage = $('#stage'), world = $('#world');
function fit(){ const s = Math.min(innerWidth/1080, innerHeight/1920); stage.style.transform = `translate(${(innerWidth-1080*s)/2}px,${(innerHeight-1920*s)/2}px) scale(${s})`; }
addEventListener('resize', fit); fit();
const END = 30;
const tl = gsap.timeline({paused:true}); window.__tl = tl;

/* ---------- helpers ---------- */
function mkScene(bg){ const d = document.createElement('div'); d.className = 'sc'; d.style.background = bg; world.appendChild(d); gsap.set(d, {autoAlpha:0}); return d; }
function scene(sc, a, b){ if (a < .2) tl.set(sc, {autoAlpha:1}, 0); else tl.to(sc, {autoAlpha:1, duration:.3, ease:'none'}, a - .1); if (b < END) tl.to(sc, {autoAlpha:0, duration:.3, ease:'none'}, b - .1); }
function H(sc, html, x, y, css = '', cls = ''){ const d = document.createElement('div'); d.className = 'o ' + cls; d.style.cssText = `left:${x}px;top:${y}px;${css}`; d.innerHTML = html; sc.appendChild(d); return d; }
function TX(sc, text, x, y, size, color, cls = 'm', extra = ''){ const d = document.createElement('div'); d.className = 'tx ' + cls; d.innerHTML = text; d.style.cssText = `left:${x}px;top:${y}px;font-size:${size}px;color:${color};${extra}`; sc.appendChild(d); gsap.set(d, {xPercent:-50, yPercent:-50}); return d; }
const hide = (...e) => gsap.set(e.flat(), {scale:0, autoAlpha:0});
const pop = (e, t, s = 1, d = .5, ease = 'back.out(2.2)') => tl.to(e, {scale:s, autoAlpha:1, duration:d, ease}, t);
function glow(sc, x, y, r, color){ const d = document.createElement('div'); d.className = 'o'; d.style.cssText = `width:${r*2}px;height:${r*2}px;left:${x-r}px;top:${y-r}px;border-radius:50%;background:radial-gradient(circle,${color} 0%,transparent 68%)`; sc.appendChild(d); return d; }
function sparkles(sc, x, y, t, n = 8, R = 240, color = '#ffd9e1'){
  for (let i = 0; i < n; i++){
    const s = H(sc, `<svg width="50" height="50" viewBox="0 0 60 60"><path d="M30 0C33 20 40 27 60 30C40 33 33 40 30 60C27 40 20 33 0 30C20 27 27 20 30 0Z" fill="${color}"/></svg>`, x - 25, y - 25); hide(s);
    const a = i/n*Math.PI*2 + .4, r = R*(.6 + (i%3)*.25);
    tl.to(s, {x:Math.cos(a)*r, y:Math.sin(a)*r, scale:.5 + (i%3)*.35, autoAlpha:1, rotation:90, duration:.5, ease:'power2.out'}, t + i*.03);
    tl.to(s, {autoAlpha:0, scale:0, duration:.4}, t + .55 + i*.03);
  }
}
const punch = t => tl.fromTo(world, {scale:1.03}, {scale:1, duration:.4, ease:'power2.out', immediateRender:false}, t);

/* ---------- ícones ---------- */
const HANGER = '<path d="M65 40L8 70H122Z" fill="none" stroke="#d9d2c0" stroke-width="6" stroke-linejoin="round"/><path d="M65 40C65 24 82 24 82 12C82 2 66 0 64 12" fill="none" stroke="#d9d2c0" stroke-width="6" stroke-linecap="round"/>';
const GARM = {
  tee:'M32 52L50 44Q65 58 80 44L98 52L124 76L106 96L94 88L94 160L36 160L36 88L24 96L6 76Z',
  dress:'M48 46L82 46L86 76L112 160L18 160L44 76Z',
  pants:'M34 46H96L102 160H70L65 90L60 160H28Z',
  jacket:'M30 50L48 44L65 66L82 44L100 50L126 78L108 98L96 90L96 160L34 160L34 90L22 98L4 78Z'
};
const garment = (kind, color, hanger = true) => `<svg width="130" height="170" viewBox="0 0 130 170">${hanger ? HANGER : ''}<path class="g" d="${GARM[kind]}" fill="${color}" stroke="rgba(0,0,0,.25)" stroke-width="3" stroke-linejoin="round"/></svg>`;
const PERSON = c => `<svg width="90" height="130" viewBox="0 0 90 130"><circle cx="45" cy="32" r="28" fill="${c}"/><path d="M4 130C4 84 24 68 45 68C66 68 86 84 86 130Z" fill="${c}"/></svg>`;
const CHEER = c => `<svg width="120" height="170" viewBox="0 0 120 170"><circle cx="60" cy="40" r="26" fill="${c}"/><path d="M14 170C14 110 34 84 60 84C86 84 106 110 106 170Z" fill="${c}"/><path d="M26 100L10 40M94 100L110 40" stroke="${c}" stroke-width="16" stroke-linecap="round"/></svg>`;
const HEART = `<svg width="120" height="106" viewBox="0 0 90 80"><path d="M45 78C10 52 0 34 0 22C0 8 12 0 24 0C34 0 41 6 45 14C49 6 56 0 66 0C78 0 90 8 90 22C90 34 80 52 45 78Z" fill="#ff5a6e"/></svg>`;
const OLD = ['#8d8a7a', '#9a9486', '#7d8374', '#a39f8f'], NEW = ['#ffa8bb', '#f2c14e', '#7bd389', '#f4efe2', '#8ec5ff'];

/* ================= CENAS ================= */
/* 1 · guarda-roupa cheio (0 – 3.1) */
const grid = [];
{ const sc = mkScene('linear-gradient(#1b2a1c,#14201a)'); scene(sc, 0, 6.2);
  const kinds = ['tee', 'dress', 'pants', 'jacket', 'tee', 'jacket', 'tee', 'dress', 'pants', 'tee', 'pants', 'tee', 'jacket', 'dress', 'tee'];
  const rail = H(sc, '', 60, 480, 'width:960px;height:14px;border-radius:7px;background:#6b5a42;box-shadow:0 6px 0 rgba(0,0,0,.3)'); gsap.set(rail, {scaleX:0, transformOrigin:'0 50%'}); tl.to(rail, {scaleX:1, duration:.4, ease:'power3.out'}, .1);
  kinds.forEach((k, i) => { const cx = 150 + (i%5)*195, cy = 640 + Math.floor(i/5)*235;
    const g = H(sc, garment(k, OLD[i%4]), cx - 65, cy - 85); hide(g); grid.push({g, k, cx, cy, sc});
    tl.to(g, {scale:1.1, autoAlpha:1, duration:.35, ease:'back.out(2)'}, .35 + i*.07); });
  const q = H(sc, '<div class="m" style="font-size:520px;color:#ff6b6b;line-height:1;text-shadow:0 10px 0 rgba(0,0,0,.4)">?</div>', 540, 300); gsap.set(q, {xPercent:-50, yPercent:-50}); hide(q);
  pop(q, 1.75, 1, .5, 'elastic.out(1,.5)'); tl.to(q, {rotation:9, duration:.18, yoyo:true, repeat:5, ease:'sine.inOut'}, 2.3); punch(1.75);
  tl.to(grid.map(o => o.g), {y:'+=8', duration:.12, yoyo:true, repeat:3, ease:'sine.inOut', stagger:.01}, 2.0);
}
/* 2 · renovar o visual renova o ânimo (3.1 – 6.2) */
{ const sc = grid[0].sc; // continua na mesma cena, mas recolore
  const ov = document.createElement('div'); ov.className = 'o'; ov.style.cssText = 'width:1080px;height:1920px;background:linear-gradient(#2f5a30,#1f3a21);opacity:0'; sc.prepend(ov); tl.to(ov, {opacity:1, duration:.6}, 3.2);
  const q = sc.querySelectorAll('.m')[0]; tl.to(q, {scale:0, autoAlpha:0, duration:.3, ease:'back.in(2)'}, 3.25);
  grid.forEach(({g}, i) => { const p = g.querySelector('.g'); tl.to(p, {fill:NEW[i%5], duration:.3}, 3.5 + i*.06);
    tl.fromTo(g, {rotation:-6}, {rotation:0, duration:.4, ease:'elastic.out(1,.4)', immediateRender:false}, 3.5 + i*.06); });
  const face = H(sc, '<svg width="260" height="260" viewBox="0 0 260 260"><circle cx="130" cy="130" r="120" fill="#f2c14e" stroke="#c98f1a" stroke-width="8"/><circle cx="92" cy="104" r="14" fill="#5a3d0a"/><circle cx="168" cy="104" r="14" fill="#5a3d0a"/><path d="M70 150Q130 215 190 150" stroke="#5a3d0a" stroke-width="14" fill="none" stroke-linecap="round"/></svg>', 540 - 130, 190);
  hide(face); pop(face, 4.3, 1, .55, 'elastic.out(1,.5)'); tl.to(face, {rotation:8, duration:.4, yoyo:true, repeat:3, ease:'sine.inOut'}, 4.9);
  sparkles(sc, 540, 320, 4.4, 10, 300, '#ffd9e1');
  const nv = H(sc, '<div class="serif" style="font-size:150px;color:#ffa8bb;white-space:nowrap">novo!</div>', 800, 400); gsap.set(nv, {xPercent:-50, yPercent:-50, rotation:-10}); hide(nv); pop(nv, 3.9, 1, .5);
  grid[0].sc = null;
}
/* 3 · o que não usa mais pode vestir alguém (6.2 – 9.6) */
{ const sc = mkScene('linear-gradient(#3f6e3b,#1f3a21)'); scene(sc, 6.2, 9.6);
  glow(sc, 540, 600, 700, 'rgba(255,168,187,.25)');
  const box = H(sc, `<svg width="360" height="300" viewBox="0 0 360 300"><path d="M20 80H340V280H20Z" fill="#c8975a" stroke="#8a5f2a" stroke-width="8"/><path d="M20 80L60 20H300L340 80Z" fill="#dcae72" stroke="#8a5f2a" stroke-width="8" stroke-linejoin="round" class="lid"/><rect x="110" y="140" width="140" height="70" rx="10" fill="#f4efe2"/><text x="180" y="192" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="52" fill="#3f6e3b">DOE</text></svg>`, 290, 520); hide(box); pop(box, 6.3, 1, .5);
  const tees = [0, 1, 2, 3].map(i => { const t = H(sc, garment(['tee', 'dress', 'pants', 'jacket'][i], NEW[i], false), 150 + i*70, 40); gsap.set(t, {scale:.9, autoAlpha:0});
    tl.set(t, {autoAlpha:1}, 6.55 + i*.18); tl.to(t, {x:470 - (150 + i*70 + 65), y:545, rotation:(i%2 ? 20 : -20), scale:.6, duration:.5, ease:'power2.in'}, 6.55 + i*.18); tl.to(t, {autoAlpha:0, duration:.1}, 7.0 + i*.18); return t; });
  tl.to(box, {y:-14, duration:.12, yoyo:true, repeat:1}, 7.3);
  const per = H(sc, CHEER('#f4efe2'), 740, 650); gsap.set(per, {scale:2.2, transformOrigin:'50% 100%', autoAlpha:0}); tl.to(per, {autoAlpha:1, duration:.4}, 8.0);
  const shirt = H(sc, garment('tee', '#ffa8bb', false), 735, 450); gsap.set(shirt, {x:-420, y:130, scale:.4, autoAlpha:0, rotation:-30});
  tl.set(shirt, {autoAlpha:1}, 7.85); tl.to(shirt, {x:0, y:0, scale:1.4, rotation:0, duration:.7, ease:'back.out(1.6)'}, 7.9);
  const ht = H(sc, HEART, 800, 200); hide(ht); pop(ht, 8.7, 1.2, .5); tl.to(ht, {y:-30, duration:.5, yoyo:true, repeat:3, ease:'sine.inOut'}, 9.1);
  sparkles(sc, 790, 650, 8.7, 8, 260);
}
/* 4 · peças a partir de cinco reais (9.6 – 12.4) */
{ const sc = mkScene('linear-gradient(#2f5a30,#1f3a21)'); scene(sc, 9.6, 12.4);
  glow(sc, 540, 700, 680, 'rgba(242,193,78,.22)');
  const tag = H(sc, `<div style="position:relative;width:640px;height:420px;background:#ffa8bb;border:6px solid #1f3a21;box-shadow:0 20px 50px rgba(0,0,0,.4);clip-path:polygon(0 0,100% 0,100% 100%,0 100%,0 78%,46px 50%,0 22%)"><div class="m" style="position:absolute;left:96px;top:56px;font-size:48px;color:#1f3a21;letter-spacing:3px">A PARTIR DE</div><div class="serif" style="position:absolute;left:96px;top:100px;font-size:230px;color:#1f3a21;line-height:1.05">R$ 5</div><div style="position:absolute;left:34px;top:190px;width:34px;height:34px;border-radius:50%;background:#1f3a21"></div></div>`, 220, 380); gsap.set(tag, {rotation:-6}); hide(tag);
  pop(tag, 9.8, 1, .6, 'elastic.out(1,.55)');
  [[220, 320], [820, 340], [160, 880], [880, 890]].forEach(([x, y], i) => { const g = H(sc, garment(['tee', 'dress', 'pants', 'jacket'][i], NEW[i], true), x - 65, y); hide(g); pop(g, 10.2 + i*.12, 1.0, .4); tl.to(g, {rotation:(i%2 ? 6 : -6), duration:.5, yoyo:true, repeat:3, ease:'sine.inOut', transformOrigin:'50% 0%'}, 10.8); });
  for (let i = 0; i < 8; i++){ const c = H(sc, '<svg width="70" height="70" viewBox="0 0 56 56"><circle cx="28" cy="28" r="25" fill="#f2c14e" stroke="#b97a12" stroke-width="4"/><text x="28" y="38" text-anchor="middle" font-size="28" font-weight="800" fill="#b97a12" font-family="Montserrat">R$</text></svg>', 160 + i*110, -80); gsap.set(c, {autoAlpha:0});
    tl.set(c, {autoAlpha:1}, 10.4 + i*.1); tl.to(c, {y:1000 + (i%3)*40, rotation:(i%2 ? 300 : -300), duration:.9, ease:'bounce.out'}, 10.4 + i*.1); tl.to(c, {autoAlpha:0, duration:.2}, 11.9); }
}
/* 5 · o mais importante: congresso anual de aniversário (12.4 – 20.3) */
{ const sc = mkScene('linear-gradient(#10161d,#0f1a14)'); scene(sc, 12.4, 20.3);
  const imp = H(sc, '<div class="serif" style="font-size:190px;color:#f2c14e;white-space:nowrap;text-align:center;line-height:1">o mais<br>importante</div>', 540, 520); gsap.set(imp, {xPercent:-50, yPercent:-50}); hide(imp);
  pop(imp, 12.6, 1, .6); punch(12.6); tl.to(imp, {scale:.55, y:-330, duration:.6, ease:'power3.inOut'}, 14.3);
  // feixes de luz
  const beams = [-1, 1].map(s => { const b = H(sc, '', s < 0 ? 140 : 560, 540, 'width:380px;height:900px;background:linear-gradient(rgba(255,240,200,.32),rgba(255,240,200,0));clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);transform-origin:50% 0'); gsap.set(b, {rotation:s*-14, autoAlpha:0}); tl.to(b, {autoAlpha:1, duration:.5}, 15.4); tl.to(b, {rotation:s*14, duration:1.6, yoyo:true, repeat:3, ease:'sine.inOut'}, 15.4); return b; });
  // palco
  const curtain = H(sc, '', 100, 540, 'width:880px;height:560px;background:linear-gradient(#3f6e3b,#2f5a30);border-radius:24px 24px 0 0;box-shadow:0 0 80px rgba(255,168,187,.25)'); gsap.set(curtain, {scaleY:0, transformOrigin:'50% 100%'}); tl.to(curtain, {scaleY:1, duration:.6, ease:'back.out(1.4)'}, 15.5);
  const floor = H(sc, '', 60, 1100, 'width:960px;height:46px;background:#c8975a;border-radius:10px;box-shadow:0 8px 0 #8a5f2a'); gsap.set(floor, {scaleX:0}); tl.to(floor, {scaleX:1, duration:.5, ease:'power3.out'}, 15.5);
  const banner = H(sc, `<div style="width:760px;height:150px;background:#f4efe2;border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 34px rgba(0,0,0,.4)"><div class="m" style="font-size:66px;color:#1f3a21;letter-spacing:2px">CONGRESSO ANUAL</div></div>`, 160, 620); hide(banner); pop(banner, 16.2, 1, .55);
  const mic = H(sc, '<svg width="120" height="360" viewBox="0 0 120 360"><rect x="54" y="150" width="12" height="190" fill="#d9d2c0"/><rect x="24" y="338" width="72" height="14" rx="7" fill="#d9d2c0"/><rect x="34" y="40" width="52" height="100" rx="26" fill="#ffa8bb" stroke="#fff" stroke-width="6"/><path d="M34 140H86" stroke="#fff" stroke-width="6"/></svg>', 230, 780); hide(mic); pop(mic, 16.6, 1, .5);
  const cake = H(sc, '<svg width="260" height="300" viewBox="0 0 260 300"><rect x="30" y="150" width="200" height="110" rx="14" fill="#f4efe2"/><path d="M30 190Q55 215 80 190T130 190T180 190T230 190V160H30Z" fill="#ffa8bb"/><rect x="118" y="90" width="24" height="60" rx="6" fill="#f2c14e"/><path d="M130 40C112 66 118 82 130 82C142 82 148 66 130 40Z" fill="#ff8a3d"/></svg>', 840, 760); hide(cake); pop(cake, 17.5, .8, .6, 'elastic.out(1,.5)');
  const ann = H(sc, '<div class="serif" style="font-size:84px;color:#ffa8bb;white-space:nowrap">aniversário</div>', 540, 880); gsap.set(ann, {xPercent:-50, rotation:-4}); hide(ann); pop(ann, 17.6, 1, .5);
  // multidão
  const crowd = []; for (let i = 0; i < 9; i++){ const c = H(sc, CHEER(['#f4efe2', '#ffa8bb', '#f2c14e'][i%3]), 60 + i*108, 1030); gsap.set(c, {scale:.7, transformOrigin:'50% 100%', y:200, autoAlpha:0}); crowd.push(c);
    tl.to(c, {y:0, autoAlpha:1, duration:.4, ease:'back.out(1.6)'}, 18.7 + i*.05); tl.to(c, {y:-24, duration:.22, yoyo:true, repeat:6, ease:'sine.inOut'}, 19.1 + i*.04); }
  const nome = H(sc, '<div style="text-align:center"><div class="m" style="font-size:62px;letter-spacing:3px;color:#f4efe2">BOLA DE NEVE</div><div class="m" style="font-size:34px;letter-spacing:8px;color:#ffa8bb;margin-top:6px">CHURCH | JARAGUÁ</div></div>', 540, 1190); gsap.set(nome, {xPercent:-50}); hide(nome); pop(nome, 18.9, 1, .5);
  // fundos: barra "cada peça conta"
  const lab = TX(sc, 'CADA PEÇA CONTA', 540, 360, 44, '#f4efe2', 'm', 'letter-spacing:6px'); hide(lab); pop(lab, 14.5, 1, .4);
  const trk = H(sc, '<div class="fl" style="position:absolute;left:0;top:0;height:100%;width:100%;border-radius:26px;background:linear-gradient(90deg,#ffa8bb,#f2c14e);transform-origin:0 50%"></div>', 140, 410, 'width:800px;height:52px;border-radius:26px;background:rgba(244,239,226,.16);overflow:hidden'); gsap.set(trk, {autoAlpha:0}); tl.to(trk, {autoAlpha:1, duration:.3}, 14.5);
  const fl = trk.querySelector('.fl'); gsap.set(fl, {scaleX:.04}); tl.to(fl, {scaleX:1, duration:5.0, ease:'power1.inOut'}, 14.6);
  for (let i = 0; i < 9; i++){ const c = H(sc, garment(['tee', 'dress', 'pants', 'jacket'][i%4], NEW[i%5], false), 140 + (i%9)*86, 40); gsap.set(c, {scale:.34, autoAlpha:0});
    tl.set(c, {autoAlpha:1}, 14.6 + i*.28); tl.to(c, {y:395, scale:.18, duration:.4, ease:'power2.in'}, 14.6 + i*.28); tl.to(c, {autoAlpha:0, duration:.1}, 15.0 + i*.28); }
  sparkles(sc, 540, 800, 19.2, 14, 480, '#f2c14e');
  for (let i = 0; i < 24; i++){ const cf = H(sc, '', (i*47)%1080, -40, `width:14px;height:22px;background:${['#ffa8bb', '#f2c14e', '#f4efe2', '#7bd389'][i%4]};border-radius:3px`); gsap.set(cf, {autoAlpha:0});
    tl.set(cf, {autoAlpha:1}, 17.7 + (i%8)*.06); tl.to(cf, {y:1960, x:(i%2 ? 60 : -60), rotation:(i%2 ? 540 : -540), duration:2.0 + (i%5)*.2, ease:'none'}, 17.7 + (i%8)*.06); }
}
/* 6 · você veste bem… e faz o bem (20.3 – 23.2) */
{ const sc = mkScene('linear-gradient(#ffa8bb,#f08aa0)'); scene(sc, 20.3, 23.2);
  const L = H(sc, garment('tee', '#2f5a30', true), 130, 480); gsap.set(L, {scale:2.2, transformOrigin:'50% 0%'}); hide(L); gsap.set(L, {scale:0}); tl.to(L, {scale:2.2, autoAlpha:1, duration:.5, ease:'back.out(2)'}, 20.5);
  const R = H(sc, HEART, 700, 560); gsap.set(R, {scale:0, autoAlpha:0}); tl.to(R, {scale:2.6, autoAlpha:1, duration:.5, ease:'back.out(2)'}, 21.4); tl.to(R, {scale:2.9, duration:.3, yoyo:true, repeat:3, ease:'sine.inOut'}, 21.95);
